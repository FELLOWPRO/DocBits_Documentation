name: Docs Search Rebuild

# Manual: refresh or fully rebuild the docs search index (one language or all).
#
#   refresh  full ingest + reconcile (hash-skip: unchanged pages are not
#            re-embedded, removed pages are deleted). Safe, cheap, default.
#   rebuild  drops the language's whole OpenSearch index first (POST
#            /docs/purge), then ingests every page again (re-embeds all).
#            The language has no search results for a few minutes meanwhile.
#
# Both finish with the self test (one real question per language must find
# its page through the live hybrid search). Shares the concurrency group with
# Docs Search Sync, so runs queue instead of racing each other's index writes.
# Targets whatever DOCS_INGEST_URL points to (secrets of this repo).

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language to process"
        type: choice
        default: all
        options: [all, main, de, es, fr, it, nl, pl, pt, zh]
      mode:
        description: "refresh = ingest + reconcile, rebuild = purge the language index first"
        type: choice
        default: refresh
        options: [refresh, rebuild]

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

concurrency:
  group: docs-search-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on:
      group: DocBits Documentation
      labels: k9s
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { lang: main, root: public_docs }
          - { lang: de, root: _lang/public_docs }
          - { lang: es, root: _lang/public_docs }
          - { lang: fr, root: _lang/public_docs }
          - { lang: it, root: _lang/public_docs }
          - { lang: nl, root: _lang/public_docs }
          - { lang: pl, root: _lang/public_docs }
          - { lang: pt, root: _lang/public_docs }
          - { lang: zh, root: _lang/public_docs }
    steps:
      - uses: actions/checkout@v6
        if: inputs.lang == 'all' || inputs.lang == matrix.lang
        with:
          fetch-depth: 1

      - name: Check search sync regressions
        if: inputs.lang == 'all' || inputs.lang == matrix.lang
        run: python3 -m unittest discover -s .github/scripts -p 'test_docs_search_sync*.py'

      - name: Purge index (rebuild only)
        if: (inputs.lang == 'all' || inputs.lang == matrix.lang) && inputs.mode == 'rebuild'
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ matrix.lang }}
          DOCS_ROOT: ${{ matrix.root }}
        run: python3 .github/scripts/docs_search_sync.py purge --lang "$SYNC_LANG"

      # The language spaces sync from their own branch (public_docs/) since
      # 2026-11-03; read the pages from there, not from main.
      - name: Fetch language branch pages
        if: (inputs.lang == 'all' || inputs.lang == matrix.lang) && matrix.lang != 'main'
        env:
          SYNC_LANG: ${{ matrix.lang }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$SYNC_LANG:refs/remotes/origin/$SYNC_LANG"
          mkdir -p _lang
          git archive "origin/$SYNC_LANG" public_docs | tar -x -C _lang

      - name: Full ingest + reconcile
        if: inputs.lang == 'all' || inputs.lang == matrix.lang
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ matrix.lang }}
          DOCS_ROOT: ${{ matrix.root }}
        run: python3 .github/scripts/docs_search_sync.py full --lang "$SYNC_LANG"

      - name: Verify search
        if: inputs.lang == 'all' || inputs.lang == matrix.lang
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ matrix.lang }}
          DOCS_ROOT: ${{ matrix.root }}
        run: python3 .github/scripts/docs_search_sync.py verify --lang "$SYNC_LANG"
