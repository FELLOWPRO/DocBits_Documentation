name: Docs Search Sync

# Keeps the fulltextsearch docs search index (CORE-6111, Settings-Assistent)
# in step with docs.docbits.com.
#
# - push to main (docbits/) or de (readme/): diffs the two commits and POSTs only the changed
#   pages (see .github/scripts/docs_search_sync.py "diff" mode). A rename
#   ingests the new URL before deleting the old one; a SUMMARY.md change
#   also ingests any page newly reachable from it (even if that page's
#   own file wasn't touched in this push).
# - nightly schedule AND workflow_dispatch: the SAME full ingest +
#   reconcile per lang (hash-skip keeps re-ingesting unchanged pages
#   cheap — no re-embedding). This is the safety net for whatever a
#   diff-based push step could miss: a squash-merge whose `before` SHA
#   doesn't reflect the real prior state, a SUMMARY.md-only publication
#   change, a replaced image asset, or a run that failed partway through.
#
# concurrency: ONE global group, not per-ref (CORE-6111 review round 2) —
# a full run (nightly/workflow_dispatch) writes ALL languages' indices
# in a single run, so a per-ref group would still let a main-branch push
# and a de-branch push (or a full run and either push) race each other's
# OpenSearch writes. Every sync, on any ref, queues behind whatever's
# already running rather than cancelling it (cancel-in-progress: false),
# since a cancelled ingest can leave a page's stale-ordinal cleanup
# half-applied.
#
# Requires two repo secrets that this PR does NOT create (see the PR
# description for the manual setup step):
#   DOCS_INGEST_URL  — the fulltextsearch base URL (dev for now)
#   DOCS_INGEST_KEY  — the shared X-Service-Key value (matches
#                      fulltextsearch's DOCS_INGEST_SERVICE_KEY config var)

on:
  push:
    branches:
      - main
      - de
    paths:
      - "docbits/**"
      - "readme/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

concurrency:
  group: docs-search-sync
  cancel-in-progress: false

jobs:
  diff-sync:
    if: github.event_name == 'push'
    runs-on:
      group: DocBits Documentation
      labels: k9s
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check search sync regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_docs_search_sync*.py'

      - name: Sync changed pages
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ github.ref_name }}
          # English lives in docbits/ on main (the GitBook space imports it);
          # the language branches keep their own readme/ layout.
          DOCS_ROOT: ${{ github.ref_name == 'main' && 'docbits' || 'readme' }}
          SYNC_BEFORE: ${{ github.event.before }}
          SYNC_AFTER: ${{ github.event.after }}
        run: |
          python3 .github/scripts/docs_search_sync.py diff \
            --lang "$SYNC_LANG" \
            --before "$SYNC_BEFORE" \
            --after "$SYNC_AFTER"

  full-sync:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on:
      group: DocBits Documentation
      labels: k9s
    strategy:
      fail-fast: false
      # 9 languages ingesting at once overloaded the shared ingress (502s)
      max-parallel: 3
      matrix:
        # lang = index key (docs branch name), root = folder the pages are
        # read from: docbits/ on main for English, the branch's readme/ for
        # the languages (fetched into _lang/ by the step below).
        include:
          - { lang: main, root: docbits }
          - { lang: de, root: _lang/readme }
          - { lang: es, root: _lang/readme }
          - { lang: fr, root: _lang/readme }
          - { lang: it, root: _lang/readme }
          - { lang: nl, root: _lang/readme }
          - { lang: pl, root: _lang/readme }
          - { lang: pt, root: _lang/readme }
          - { lang: zh, root: _lang/readme }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check search sync regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_docs_search_sync*.py'

      # The language spaces sync from their own branch (readme/) since
      # 2026-11-03; read the pages from there, not from main.
      - name: Fetch language branch pages
        if: matrix.lang != 'main'
        env:
          SYNC_LANG: ${{ matrix.lang }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$SYNC_LANG:refs/remotes/origin/$SYNC_LANG"
          mkdir -p _lang
          git archive "origin/$SYNC_LANG" readme | tar -x -C _lang

      - name: Full ingest + reconcile
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ matrix.lang }}
          DOCS_ROOT: ${{ matrix.root }}
        run: |
          python3 .github/scripts/docs_search_sync.py full \
            --lang "$SYNC_LANG"

      # Self test: one real question per language must find its page through
      # the live hybrid search (kNN + BM25 + DigitalOcean rerank). Fails when
      # the language index is empty, hits are outside the language space, or
      # the service fell back to BM25 only (embedding/rerank not working).
      - name: Verify search
        env:
          DOCS_INGEST_URL: ${{ secrets.DOCS_INGEST_URL }}
          DOCS_INGEST_KEY: ${{ secrets.DOCS_INGEST_KEY }}
          SYNC_LANG: ${{ matrix.lang }}
          DOCS_ROOT: ${{ matrix.root }}
        run: |
          python3 .github/scripts/docs_search_sync.py verify --lang "$SYNC_LANG"
