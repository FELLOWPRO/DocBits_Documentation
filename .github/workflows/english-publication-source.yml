name: English Publication Source

on:
  pull_request:
    branches: [main]
    paths:
      - "readme/**"
      - "docbits/**"
      - ".gitbook.yaml"
      - "gitbook-docs.yaml"
      - ".github/scripts/english_source_contract.py"
      - ".github/scripts/test_english_source_contract.py"
      - ".github/workflows/english-publication-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/english_source_contract.py
            /.github/scripts/test_english_source_contract.py
            /.gitbook.yaml
            /gitbook-docs.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7" "coverage>=7,<8"
      - name: Test English publication contract
        run: |
          python -m coverage run --include="*/english_source_contract.py" -m pytest -q .github/scripts/test_english_source_contract.py
          python -m coverage report --fail-under=80
      - name: Check the proposed publication paths
        run: python .github/scripts/english_source_contract.py --base HEAD^1 --head HEAD
