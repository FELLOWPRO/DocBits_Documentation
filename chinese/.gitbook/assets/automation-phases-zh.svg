" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">批准或拒绝</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">审批脚本</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">随后状态发生变化</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"></rect><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">已配置的状态变化</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">触发匹配的工作流</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">（以及 Webhook）</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">虚线标记和连线表示可选步骤。此图中的工作流在状态变化后启动，位于校验之后，而非提取之前。</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">工作流写入字段后，需检查是否会再次触发转换、校验或保存脚本。</text><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">也可在字段变化、</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">表格变化、保存和</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">审批时运行（见下方）</text></svg>
