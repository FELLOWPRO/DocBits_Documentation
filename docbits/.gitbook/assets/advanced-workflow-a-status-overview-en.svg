<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1780" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 390 V466 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V688 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V878 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1068 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1258 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1448 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 366 V390 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A: grouped overview of the six status routes</text><text x="64" y="136" font-size="25" font-weight="normal" fill="#52687c">Real Advanced configuration · anonymized explanatory diagram</text><rect x="100" y="214" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="248" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Trigger</text><text x="128" y="293" font-size="34" font-weight="bold" fill="#17324d">Document type is invoice</text><text x="128" y="343" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="436" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="470" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condition</text><text x="128" y="515" font-size="34" font-weight="bold" fill="#17324d">Status is validated; approval pending</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">N06–N07: suborganization and field checks → N08: checkbox split → N10: configured</text><text x="128" y="597" font-size="24" font-weight="normal" fill="#405c74">export OR N09: assignment → N16: email request.</text><rect x="100" y="658" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condition</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Status is ready for review</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N11: assign Group A → N14: request Email template A to Email recipient A.</text><rect x="100" y="848" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="882" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Condition</text><text x="128" y="927" font-size="34" font-weight="bold" fill="#17324d">Status is rejected</text><text x="128" y="977" font-size="24" font-weight="normal" fill="#405c74">N13: assign Group A → N15: request Email template B to Email recipient A.</text><rect x="100" y="1038" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1072" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Condition</text><text x="128" y="1117" font-size="34" font-weight="bold" fill="#17324d">Status is ready for validation</text><text x="128" y="1167" font-size="24" font-weight="normal" fill="#405c74">N12: assign Group A. This is the route recorded in the latest saved run.</text><rect x="100" y="1228" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1262" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Condition</text><text x="128" y="1307" font-size="34" font-weight="bold" fill="#17324d">Status is finished</text><text x="128" y="1357" font-size="24" font-weight="normal" fill="#405c74">N18: assign Group A.</text><rect x="100" y="1418" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1452" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Condition</text><text x="128" y="1497" font-size="34" font-weight="bold" fill="#17324d">Status is export error</text><text x="128" y="1547" font-size="24" font-weight="normal" fill="#405c74">N20: assign Group A.</text><rect x="64" y="1608" width="1072" height="122" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1650" font-size="28" font-weight="bold" fill="#6d5324">Grouped configuration map. Separate branches enter a queue; they are not</text><text x="92" y="1688" font-size="28" font-weight="bold" fill="#6d5324">an else-if sequence. Full settings and connections follow below.</text></g></svg>