<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1686" viewBox="0 0 1200 1686"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1686" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M618 366 L618 436" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V688 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V910 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V1100 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V1322 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 588 V612 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">B: grouped overview of the four status routes</text><text x="64" y="136" font-size="25" font-weight="normal" fill="#52687c">Real Advanced configuration · anonymized explanatory diagram</text><rect x="100" y="214" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="248" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Trigger</text><text x="128" y="293" font-size="34" font-weight="bold" fill="#17324d">Document type is invoice</text><text x="128" y="343" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="436" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="470" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condition</text><text x="128" y="515" font-size="34" font-weight="bold" fill="#17324d">Suborganization is Suborganization A</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">condition_sub_org_is_isnot · v2 · sub_org_id = Suborganization A · operator = is</text><rect x="100" y="658" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condition</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Status is validated; approval pending</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N06/N07: Field B checks → alternate export OR Field A comparisons → decision-table</text><text x="128" y="819" font-size="24" font-weight="normal" fill="#405c74">assignment / checkbox fallback / export. Detailed branch and complete tables below.</text><rect x="100" y="880" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="914" font-size="23" font-weight="bold" fill="#52687c">N12 · AND · Condition</text><text x="128" y="959" font-size="34" font-weight="bold" fill="#17324d">Status is ready for validation</text><text x="128" y="1009" font-size="24" font-weight="normal" fill="#405c74">N13: assign Group A.</text><rect x="100" y="1070" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1104" font-size="23" font-weight="bold" fill="#52687c">N16 · AND · Condition</text><text x="128" y="1149" font-size="34" font-weight="bold" fill="#17324d">Status is finished</text><text x="128" y="1199" font-size="24" font-weight="normal" fill="#405c74">N19: Field B=true → N20: Field C=true → N17: assign Group A. Sibling N18: Field C=false</text><text x="128" y="1231" font-size="24" font-weight="normal" fill="#405c74">→ N21: status change. Latest run followed N17.</text><rect x="100" y="1292" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1326" font-size="23" font-weight="bold" fill="#52687c">N26 · AND · Condition</text><text x="128" y="1371" font-size="34" font-weight="bold" fill="#17324d">First approval complete; second pending</text><text x="128" y="1421" font-size="24" font-weight="normal" fill="#405c74">N29: Field C=false → N28: set Field C=true → N27: export with boolean=false. First</text><text x="128" y="1453" font-size="24" font-weight="normal" fill="#405c74">approval complete; second pending.</text><rect x="64" y="1514" width="1072" height="122" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1556" font-size="28" font-weight="bold" fill="#6d5324">Grouped configuration map. Separate branches enter a queue; they are not</text><text x="92" y="1594" font-size="28" font-weight="bold" fill="#6d5324">an else-if sequence. Full settings and connections follow below.</text><rect x="581" y="385" width="74" height="29" rx="6" fill="#f8fbfd"/><text x="589" y="407" font-size="22" font-weight="normal" fill="#4f718c">Yes</text></g></svg>