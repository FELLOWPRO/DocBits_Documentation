<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="What each tool can do"><title>What each tool can do</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="380" fill="#ffffff"/><rect x="20" y="16" width="920" height="40" rx="8" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="28" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Tool</text><text x="243" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Runs when</text><text x="493" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Can change data</text><text x="658" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Can stop a document</text><text x="858" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Code</text><rect x="20" y="64" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="64" width="8" height="44" rx="4" fill="#1f8ab0"/><text x="34" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f8ab0">Transformation Rules</text><text x="243" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">every pass and save</text><text x="493" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: values, rows</text><text x="658" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><text x="858" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><rect x="20" y="114" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="114" width="8" height="44" rx="4" fill="#c98318"/><text x="34" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c98318">Custom Validation Rules</text><text x="243" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">every validation run</text><text x="493" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><text x="658" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: error or warning</text><text x="858" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><rect x="20" y="164" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="164" width="8" height="44" rx="4" fill="#7b5cc4"/><text x="34" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7b5cc4">PO Matching Rules</text><text x="243" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">after lookup, button, new PO</text><text x="493" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Match data only</text><text x="658" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: auto export needs a match</text><text x="858" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><rect x="20" y="214" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="214" width="8" height="44" rx="4" fill="#3d4f5c"/><text x="34" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3d4f5c">Script</text><text x="243" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">13 trigger points</text><text x="493" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: fields, tables, tasks</text><text x="658" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Indirectly (invalid, task)</text><text x="858" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text><rect x="20" y="264" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="264" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">Standard / Advanced Workflow</text><text x="243" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">after a status change</text><text x="493" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: via cards</text><text x="658" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, assign, approve</text><text x="858" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">No</text><rect x="20" y="314" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="314" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">Workflow SDK card</text><text x="243" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">when the workflow runs</text><text x="493" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Yes: fields, tables</text><text x="658" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, task</text><text x="858" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></svg>