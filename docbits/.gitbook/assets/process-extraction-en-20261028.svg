<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">From file to recognized data</title>
<desc id="desc">View document type, data source and extraction path separately. Not every document goes through OCR. Table and header sources may differ; the active settings determine the path.</desc>
<rect width="2000" height="1050" fill="white"/>
