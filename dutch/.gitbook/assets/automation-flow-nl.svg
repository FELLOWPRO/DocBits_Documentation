" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validatie</text><line x1="824.0" y1="122" x2="824.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="824.0" cy="316" r="11" fill="#3d4f5c"/><text x="824.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">E</text><text x="824.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Na</text><text x="824.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validatie</text><rect x="14" y="268" width="660" height="26" fill="#ffffff"/><text x="20" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d4f5c">Script: draait op de triggerpunten die u kiest (13 in totaal, hoofdpunten getoond)</text><text x="20" y="396" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Terwijl een gebruiker in het validatiescherm werkt</text><rect x="20.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="129.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Veld of tabelcel bewerken</text><text x="129.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script bij veld-/tabelwijziging</text><text x="129.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">voorbeeld Transformatieregels</text><rect x="254.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="363.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Opslaan of Valideren</text><text x="363.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Transformatieregels → Validatie</text><text x="363.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script bij opslaan → PO-rematch</text><rect x="488.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="597.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Goedkeuren/afwijzen</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script bij goedkeuring</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">daarna verandert de status</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Elke statuswijziging</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Workflows starten</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">(ook webhooks)</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Gestippelde blokken en lijnen zijn optioneel. Workflows starten na een statuswijziging, dus na de validatie, nooit vóór de extractie.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Een workflow die een veld schrijft, activeert de transformatie-, validatie- en opslagscripts opnieuw.</text></g><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">Ook bij veldwijziging,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">tabelwijziging, opslaan,</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">goedkeuring (zie onder)</text></svg>