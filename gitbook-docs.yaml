$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: DocBits - IDP for Infor ERP
  structure:
    - type: space
      key: space-1
      title: 🇺🇸 English
      path: docbits
      default: true
      content:
        directory: ./docbits
        language: en
    - type: space
      key: space-2
      title: 🇩🇪 Deutsch
      path: deutsch
      content:
        directory: ./deutsch
        language: de
    - type: space
      key: space-3
      title: 🇪🇸 Español
      path: espanol
      content:
        directory: ./espanol
        language: es
    - type: space
      key: space-4
      title: 🇫🇷 Français
      localizedTitle:
        fr: Français
      path: french
      content:
        directory: ./french
        language: fr
    - type: space
      key: space-5
      title: 🇮🇹 Italiano
      path: italian
      content:
        directory: ./italian
        language: it
    - type: space
      key: space-6
      title: 🇵🇹 Português
      path: portuguese
      content:
        directory: ./portuguese
        language: pt
    - type: space
      key: space-7
      title: 🇵🇱 Polski
      path: polish
      content:
        directory: ./polish
        language: pl
    - type: space
      key: space-8
      title: 🇳🇱 Nederlands
      path: dutch
      content:
        directory: ./dutch
        language: nl
    - type: space
      key: space-9
      title: 🇨🇳 Chinese
      localizedTitle:
        zh: Chinese
      path: chinese
      content:
        directory: ./chinese
        language: zh
