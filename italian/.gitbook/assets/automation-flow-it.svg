font-size="12.5" font-weight="500" fill="#5b6f7c">Chip e linee tratteggiati sono facoltativi. I Workflow partono dopo un cambio di stato, quindi dopo la convalida, mai prima dell&#x27;estrazione.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Un workflow che scrive un campo riattiva gli script di trasformazione, convalida e salvataggio.</text></g><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">Anche a modifica campo,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">modifica tabella, salvataggio,</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">approvazione (vedi sotto)</text></svg>