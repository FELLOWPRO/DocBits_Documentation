<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocBits eDocs country explainer review</title>
<style>body{margin:0;padding:16px;font:16px system-ui;background:#0a2531;color:#f5f5f5}main{max-width:960px;margin:auto}video,img{width:100%;display:block}[hidden]{display:none!important}h1{font-size:22px}select{font:inherit;max-width:100%;padding:8px;margin:4px 0 12px}label{display:block}::cue{font:16px system-ui;background:#0a2531ee;color:white}p{overflow-wrap:anywhere}</style>
<main><h1></h1><label>Language / Sprache <select id="language"></select></label><label><span id="country-label"></span> <select id="country"></select></label><p id="status" role="status" hidden></p><img id="screenshot" alt="" hidden><video controls playsinline preload="metadata" tabindex="0"><track kind="captions" default></video><p id="transcript"></p></main>
<script type="module">
const params=new URLSearchParams(location.search),locale=params.get('lang')||'de',country=params.get('country')||'germany';
const text=await fetch(`translations/${locale}.json`).then(r=>r.json());
const delivery=await fetch('delivery.json').then(r=>r.json());
const available=delivery.locales[locale];
const language=document.querySelector('#language'),countrySelect=document.querySelector('#country');
for(const [key,name] of Object.entries({en:'English',de:'Deutsch',es:'Español',fr:'Français',it:'Italiano',nl:'Nederlands',pl:'Polski',pt:'Português',zh:'中文'})){const option=new Option(name,key);option.selected=key===locale;language.add(option);}
for(const [key,c] of Object.entries(text.countries)){const option=new Option(c.name,key);option.selected=key===country;countrySelect.add(option);}
document.querySelector('#country-label').textContent=text.country_column;
for(const select of [language,countrySelect])select.addEventListener('change',()=>{params.set('lang',language.value);params.set('country',countrySelect.value);location.search=params;});
const page='edocs_country_'+country.replaceAll('-','_');
const folders={en:'docbits',de:'deutsch',es:'espanol',fr:'french',it:'italian',nl:'dutch',pl:'polish',pt:'portuguese',zh:'chinese'};
const base=`../../${folders[locale]}/.gitbook/assets/edocs-support-${country}-${locale}`;
document.documentElement.lang=locale;document.querySelector('h1').textContent=text.countries[country].name+' — '+text.video_title;
const video=document.querySelector('video');
if(available.films.includes(country)){
 video.src=base+'.mp4';video.poster=base+'.png';
 const track=video.querySelector('track');track.src=base+'.vtt';track.srclang=locale;track.label=locale;video.load();
}else{
 video.hidden=true;
 const pending={en:'This country video is still being prepared.',de:'Dieses Ländervideo wird noch vorbereitet.',es:'El vídeo de este país está en preparación.',fr:'La vidéo de ce pays est en préparation.',it:'Il video per questo paese è in preparazione.',nl:'Deze landvideo wordt nog voorbereid.',pl:'Film dla tego kraju jest w przygotowaniu.',pt:'O vídeo deste país está em preparação.',zh:'该国家或地区的视频仍在制作中。'};
 const status=document.querySelector('#status');status.textContent=pending[locale];status.hidden=false;
 if(available.screenshots.includes(country)){
  const image=document.querySelector('#screenshot');image.src=base+'.png';image.alt=text.countries[country].name;image.hidden=false;
 }
}
document.querySelector('#transcript').textContent=text.countries[country].narration+' '+(country==='costa-rica'?text.narration_unconfirmed:text.narration_workflow)+' '+text.narration_accept;
</script>
