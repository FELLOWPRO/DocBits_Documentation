<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eDocs – lokale Medienprüfung</title>
<style>
  :root { color-scheme: dark; font: 17px/1.55 system-ui, sans-serif; background: #0a2531; color: #f5f5f5; }
  body { max-width: 960px; margin: auto; padding: 24px; }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.2; }
  a { color: #4db6da; }
  select { font: inherit; padding: 8px; margin-left: 8px; }
  video { display: block; width: 100%; margin: 24px 0; background: #0a2531; }
  li { margin-bottom: 12px; }
  #status { color: #9fbdc9; }
  @media(max-width: 480px) { body { padding: 16px; } }
</style>
<h1 id="title">eDocs: Klassifizierung elektronischer Gutschriften</h1>
<p>Lokale Vorschau der Dokumentationsanhänge. Sprache, Wiedergabe und Untertitel können hier geprüft werden.</p>
<label for="locale">Sprache</label>
<select id="locale">
  <option value="en">English</option><option value="de" selected>Deutsch</option>
  <option value="es">Español</option><option value="fr">Français</option>
  <option value="it">Italiano</option><option value="nl">Nederlands</option>
  <option value="pl">Polski</option><option value="pt">Português</option>
  <option value="zh">简体中文</option>
</select>
<video id="player" controls preload="metadata" playsinline></video>
<p><a id="guide">Dokumentationsseite</a> · <a id="captions">WebVTT</a></p>
<p id="status" role="status"></p>
<details open><summary>Transkript</summary><ol id="transcript"></ol></details>
<script>
  const folders = {en:'docbits',de:'deutsch',es:'espanol',fr:'french',it:'italian',nl:'dutch',pl:'polish',pt:'portuguese',zh:'chinese'};
  const picker = document.querySelector('#locale');
  const player = document.querySelector('#player');
  const status = document.querySelector('#status');
  async function loadLocale(locale) {
    picker.value = locale;
    player.pause();
    const prefix = `../../${folders[locale]}/.gitbook/assets/edocs-credit-note-${locale}`;
    player.replaceChildren();
    player.src = `${prefix}.mp4`;
    const track = document.createElement('track');
    Object.assign(track, {kind:'captions',src:`${prefix}.vtt`,srclang:locale,label:picker.selectedOptions[0].textContent,default:true});
    player.append(track);
    document.querySelector('#captions').href = `${prefix}.vtt`;
    document.querySelector('#guide').href = `../../${folders[locale]}/administration-and-setup/settings/global-settings/document-types/edi/credit-note-recognized-as-invoice.md`;
    status.textContent = 'Lokale Mediendatei wird geladen …';
    const response = await fetch(`content/locales/${locale}.json`);
    if (!response.ok) throw new Error(`Transkript: ${response.status}`);
    const content = await response.json();
    document.querySelector('#title').textContent = content.title;
    const transcript = document.querySelector('#transcript');
    transcript.lang = locale;
    transcript.replaceChildren(...content.segments.map(segment => {
      const item = document.createElement('li');
      item.textContent = segment.caption;
      return item;
    }));
    player.load();
  }
  player.addEventListener('loadedmetadata', () => { status.textContent = `${picker.selectedOptions[0].textContent} · ${player.duration.toFixed(1)} s`; });
  player.addEventListener('error', () => { status.textContent = 'Die lokale Mediendatei konnte nicht geladen werden.'; });
  picker.addEventListener('change', () => loadLocale(picker.value).catch(error => { status.textContent = error.message; }));
  const requested = new URLSearchParams(location.search).get('lang');
  loadLocale(Object.hasOwn(folders, requested) ? requested : 'de').catch(error => { status.textContent = error.message; });
</script>
</html>
