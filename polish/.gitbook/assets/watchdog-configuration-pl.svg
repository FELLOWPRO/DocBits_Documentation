    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">Stan połączenia</text>
  </g>
  <text x="614" y="222" fill="#44474e" font-size="10">Bieżący stan działania</text>

  <g transform="translate(592, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">Pobierz konfigurację</text>
