    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">Filtruj według typu/daty</text>
  </g>
  <text x="254" y="222" fill="#44474e" font-size="10">Zawęź wyniki</text>

  <g transform="translate(232, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">OpenSearch</text>
  </g>
  <text x="254" y="256" fill="#44474e" font-size="10">Wyszukiwanie tekstu</text>

