<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06" flood-color="#001b3c"></feDropShadow>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005cad"></stop>
      <stop offset="100%" stop-color="#0075d8"></stop>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="#f9f9ff"></rect>

  <!-- Header -->
  <rect width="800" height="56" rx="16" fill="url(#headerGrad)"></rect>
  <rect y="40" width="800" height="16" fill="url(#headerGrad)"></rect>
  <text x="400" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">WatchDog — Konfiguracja w 4 kartach</text>

  <!-- Tab bar background -->
  <rect x="32" y="72" width="736" height="38" rx="10" fill="#f0f3ff"></rect>

  <!-- Tab 1: General (active) -->
  <rect x="36" y="74" width="172" height="34" rx="8" fill="#005cad"></rect>
  <text x="122" y="96" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Ogólne</text>

  <!-- Tab 2: Logs -->
  <rect x="216" y="74" width="172" height="34" rx="8" fill="none"></rect>
  <text x="302" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">Dzienniki</text>

  <!-- Tab 3: XSLT Templates -->
  <rect x="396" y="74" width="172" height="34" rx="8" fill="none"></rect>
  <text x="482" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">Szablony XSLT</text>

  <!-- Tab 4: Export Configs -->
  <rect x="576" y="74" width="188" height="34" rx="8" fill="none"></rect>
  <text x="670" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">Konfiguracje eksportu</text>

  <!-- Tab 1 Content: General -->
  <rect x="32" y="118" width="172" height="200" rx="14" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="32" y="118" width="172" height="200" rx="14" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <rect x="32" y="118" width="172" height="36" rx="14" fill="#005cad" opacity="0.06"></rect>
  <rect x="32" y="140" width="172" height="14" fill="#005cad" opacity="0.06"></rect>
  <text x="118" y="142" text-anchor="middle" fill="#005cad" font-size="12" font-weight="700">Ogólne</text>

