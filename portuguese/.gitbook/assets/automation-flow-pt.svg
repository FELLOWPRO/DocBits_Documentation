ont-size="11.5" font-weight="400" fill="#3d4f5c">opcional</text><text x="348.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">passagem extra</text></g><g class="hl" data-k="po"><line x1="484.0" y1="122" x2="484.0" y2="160" stroke="#7b5cc4" stroke-width="1.6" /><rect x="422" y="160" width="124" height="84" rx="10" fill="#efeafb" stroke="#7b5cc4" stroke-width="1.6"/><text x="484.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">Regras de</text><text x="484.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.4" font-weight="700" fill="#7b5cc4">Correspondência de PO</text><text x="484.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">também: botão</text><text x="484.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#3d4f5c">Auto PO Match, novo PO</text></g><g class="hl" data-k="tr"><line x1="620.0" y1="122" x2="620.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="558" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="620.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Transformação</text><text x="620.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">novamente</text><text x="620.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">todas as regras</text><text x="620.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#3d4f5c">após a correspondência</text></g><g class="hl" data-k="cv"><line x1="756.0" y1="122" x2="756.0" y2="160" stroke="#c98318" stroke-width="1.6" /><rect x="694" y="160" width="124" height="84" rx="10" fill="#fdf1dc" stroke="#c98318" stroke-width="1.6"/><text x="756.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c98318">Validação</text><text x="756.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c98318">Personalizada</text><text x="756.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">cada validação</text><text x="756.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">e cada salvamento</text></g><g class="hl" data-k="wf"><line x1="892.0" y1="122" x2="892.0" y2="160" stroke="#2f9d6a" stroke-width="1.6" /><rect x="830" y="160" width="124" height="84" rx="10" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="1.6"/><text x="892.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f9d6a">Workflows</text><text x="892.0" y="201" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">Standard · Advanced</text><text x="892.0" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">· cards SDK</text><text x="892.0" y="229" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.9" font-weight="400" fill="#3d4f5c">iniciam após o status</text></g><g class="hl" data-k="script"><rect x="20" y="300" width="920" height="64" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><line x1="144.0" y1="122" x2="144.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="