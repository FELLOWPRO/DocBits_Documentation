f" font-size="13" font-weight="700" fill="#ffffff">D</text><text x="688.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Antes da</text><text x="688.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validação</text><line x1="824.0" y1="122" x2="824.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="824.0" cy="316" r="11" fill="#3d4f5c"/><text x="824.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">E</text><text x="824.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Após a</text><text x="824.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validação</text><rect x="14" y="268" width="660" height="26" fill="#ffffff"/><text x="20" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d4f5c">Script: executa nos pontos de acionamento que você escolher (13 no total, principais exibidos)</text><text x="20" y="396" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Enquanto um usuário trabalha no documento na tela de validação</text><rect x="20.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="129.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="700" fill="#1f8ab0">Editar campo ou célula de tabela</text><text x="129.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.9" font-weight="400" fill="#0A2531">Script de alteração de campo / tabela</text><text x="129.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.2" font-weight="400" fill="#0A2531">Pré-visualização das Regras de Transformação</text><rect x="254.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="363.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Salvar ou Validar</text><text x="363.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Transformação → Validação</text><text x="363.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.0" font-weight="400" fill="#0A2531">Script ao salvar → nova correspondência de PO</text><rect x="488.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="597.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Aprovar ou rejeitar</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script de aprovação</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">depois o status muda</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.9" font-weight="700" fill="#1f8ab0">Qualquer mudança de status</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Os Workflows iniciam</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">(também web hooks)</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Chips e linhas tracejados são opcionais. Workflows iniciam após uma mudança de status, ou seja, após a validação, nunca antes da extração.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Um workflow que grava um campo aciona novamente os scripts de transformação, validação e salvamento.</text></g><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">Também ao alterar campo,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">alterar tabela, salvar,</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">aprovar (veja abaixo)</text></svg>