<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1882" viewBox="0 0 1200 1882"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1882" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 390 V466 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V688 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V910 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1132 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1322 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1512 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 366 V390 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A : vue regroupée des six chemins de statut</text><text x="64" y="136" font-size="25" font-weight="normal" fill="#52687c">Configuration Advanced réelle · schéma explicatif anonymisé</text><rect x="100" y="214" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="248" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Déclencheur</text><text x="128" y="293" font-size="34" font-weight="bold" fill="#17324d">Le type de document est facture</text><text x="128" y="343" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="436" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="470" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condition</text><text x="128" y="515" font-size="34" font-weight="bold" fill="#17324d">Statut : validé ; approbation en attente</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">N06–N07 : vérifications de sous-organisation et de champ → N08 : bifurcation par case à</text><text x="128" y="597" font-size="24" font-weight="normal" fill="#405c74">cocher → N10 : export configuré OU N09 : affectation → N16 : demande d’e-mail.</text><rect x="100" y="658" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condition</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Statut : prêt pour examen</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N11 : affecter le Groupe A → N14 : demander l’envoi du Modèle d’e-mail A au Destinataire</text><text x="128" y="819" font-size="24" font-weight="normal" fill="#405c74">d’e-mail A.</text><rect x="100" y="880" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="914" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Condition</text><text x="128" y="959" font-size="34" font-weight="bold" fill="#17324d">Statut : rejeté</text><text x="128" y="1009" font-size="24" font-weight="normal" fill="#405c74">N13 : affecter le Groupe A → N15 : demander l’envoi du Modèle d’e-mail B au Destinataire</text><text x="128" y="1041" font-size="24" font-weight="normal" fill="#405c74">d’e-mail A.</text><rect x="100" y="1102" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1136" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Condition</text><text x="128" y="1181" font-size="34" font-weight="bold" fill="#17324d">Statut : prêt pour validation</text><text x="128" y="1231" font-size="24" font-weight="normal" fill="#405c74">N12 : affecter le Groupe A. Ce chemin est consigné dans la dernière exécution enregistrée.</text><rect x="100" y="1292" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1326" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Condition</text><text x="128" y="1371" font-size="34" font-weight="bold" fill="#17324d">Statut : terminé</text><text x="128" y="1421" font-size="24" font-weight="normal" fill="#405c74">N18 : affecter le Groupe A.</text><rect x="100" y="1482" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1516" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Condition</text><text x="128" y="1561" font-size="34" font-weight="bold" fill="#17324d">Statut : erreur d’export</text><text x="128" y="1611" font-size="24" font-weight="normal" fill="#405c74">N20 : affecter le Groupe A.</text><rect x="64" y="1672" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1714" font-size="28" font-weight="bold" fill="#6d5324">Vue regroupée de la configuration. Les branches distinctes entrent dans</text><text x="92" y="1752" font-size="28" font-weight="bold" fill="#6d5324">une file ; elles ne forment pas une chaîne « sinon si ». Les paramètres et</text><text x="92" y="1790" font-size="28" font-weight="bold" fill="#6d5324">connexions complets figurent ci-dessous.</text></g></svg>