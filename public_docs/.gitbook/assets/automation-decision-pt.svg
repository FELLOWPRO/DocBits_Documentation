<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="Qual ferramenta usar"><title>Qual ferramenta usar</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="590" fill="#ffffff"/><rect x="300" y="16" width="360" height="52" rx="12" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="480" y="48" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">O que você quer fazer?</text><path d="M480 68 L480 92 L129.0 92 L129.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Alterar ou limpar um</text><text x="129.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">valor</text><text x="129.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">remover prefixo, formatar data,</text><text x="129.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">mapear código, definir padrão</text><line x1="129.0" y1="232" x2="129.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="270" width="218.0" height="78" rx="12" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">Regras</text><text x="129.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">de Transformação</text><text x="129.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#3d4f5c">Precisa de consulta, tarefa ou status?</text><text x="129.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Use um Script.</text><path d="M480 68 L480 92 L363.0 92 L363.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#c98318" stroke-width="2"/><text x="363.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">Verificar dados e barrar</text><text x="363.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">documentos ruins</text><text x="363.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">obrigatório, padrão, intervalo,</text><text x="363.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">totais, verificação de linhas</text><line x1="363.0" y1="232" x2="363.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="270" width="218.0" height="78" rx="12" fill="#fdf1dc" stroke="#c98318" stroke-width="2"/><text x="363.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">Regras</text><text x="363.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">de Validação Personalizadas</text><text x="363.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.2" font-weight="400" fill="#3d4f5c">Verificação exige dados mestres ou código?</text><text x="363.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Use um Script (marcar inválido).</text><path d="M480 68 L480 92 L597.0 92 L597.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">Correlacionar linhas da</text><text x="597.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">fatura com o pedido</text><text x="597.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">item, quantidade, preço,</text><text x="597.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">tolerâncias, fallback</text><line x1="597.0" y1="232" x2="597.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="270" width="218.0" height="78" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">Regras</text><text x="597.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">de Correspondência de PO</text><text x="597.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Só o resultado da correspondência.</text><text x="597.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Não altera campos de cabeçalho.</text><path d="M480 68 L480 92 L831.0 92 L831.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">Decidir o que acontece</text><text x="831.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">depois</text><text x="831.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">atribuir, aprovar, criar tarefa,</text><text x="831.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">e-mail, exportar, chamar API</text><line x1="831.0" y1="232" x2="831.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="270" width="218.0" height="78" rx="12" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f9d6a">Standard Workflow</text><text x="831.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#3d4f5c">Ramificações, caminhos paralelos, erros:</text><text x="831.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Advanced Workflow.</text><text x="831.0" y="408" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Falta um card: Workflow SDK.</text><rect x="20" y="450" width="920" height="112" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><text x="40" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4f5c">Use um Script quando nenhuma regra ou card resolve</text><text x="40" y="506" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• você precisa de lógica em um momento específico (ao alterar campo, antes da validação, ao salvar, ao aprovar)</text><text x="40" y="526" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• você precisa de dados mestres, tarefa, mudança de status ou cálculo entre campos e tabelas</text><text x="40" y="552" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Comece pela ferramenta mais simples: regras, depois Script, por último Workflow ou card SDK.</text></svg>