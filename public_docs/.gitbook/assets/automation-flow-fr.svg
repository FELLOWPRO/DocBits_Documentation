middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">passage en plus</text></g><g class="hl" data-k="po"><line x1="484.0" y1="122" x2="484.0" y2="160" stroke="#7b5cc4" stroke-width="1.6" /><rect x="422" y="160" width="124" height="84" rx="10" fill="#efeafb" stroke="#7b5cc4" stroke-width="1.6"/><text x="484.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">Règles de</text><text x="484.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">corresp. BC</text><text x="484.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">aussi : bouton Auto</text><text x="484.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.9" font-weight="400" fill="#3d4f5c">PO Match, nouveau n° BC</text></g><g class="hl" data-k="tr"><line x1="620.0" y1="122" x2="620.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="558" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="620.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#1f8ab0">Règles de transf.</text><text x="620.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">à nouveau</text><text x="620.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">toutes les règles,</text><text x="620.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">après corresp. BC</text></g><g class="hl" data-k="cv"><line x1="756.0" y1="122" x2="756.0" y2="160" stroke="#c983