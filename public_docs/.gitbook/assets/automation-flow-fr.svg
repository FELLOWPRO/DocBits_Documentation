middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">A</text><text x="144.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Après extraction</text><text x="144.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Avant transformation</text><line x1="280.0" y1="122" x2="280.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="280.0" cy="316" r="11" fill="#3d4f5c"/><text x="280.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">B</text><text x="280.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Après</text><text x="280.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">transformation</text><line x1="416.0" y1="122" x2="416.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="416.0" cy="316" r="11" fill="#3d4f5c"/><text x="416.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">C</text><text x="416.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Avant</text><text x="416.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">corresp. BC</text><line x1="688.0" y1="122" x2="688.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="688.0" cy="316" r="11" fill="#3d4f5c"/><text x="688.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">D</text><text x="688.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Avant</text><text x="688.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validation</text><line x1="824.0" y1="122" x2="824.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="824.0" cy="316" r="11" fill="#3d4f5c"/><text x="824.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">E</text><text x="824.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Après</text><text x="824.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validation</text><rect x="14" y="268" width="660" height="26" fill="#ffffff"/><text x="20" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d4f5c">Script : s&#x27;exécute aux points choisis (13 au total, principaux affichés)</text><text x="20" y="396" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Pendant qu&#x27;un utilisateur traite le document dans l&#x27;écran de validation</text><rect x="20.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="129.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="700" fill="#1f8ab0">Modifier un champ ou une cellule</text><text x="129.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script champ / tableau</text><text x="129.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Aperçu des règles de transf.</text><rect x="254.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="363.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Save ou Validate</text><text x="363.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Règles de transf. → Validation</text><text x="363.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#0A2531">Script d&#x27;enreg. → nouvelle corresp. BC</text><rect x="488.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="597.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Approuver ou rejeter</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script d&#x27;approbation</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">puis changement de statut</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Tout changement de statut</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Les workflows démarrent</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">(aussi web hooks)</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Les pastilles et lignes en pointillés sont optionnelles. Les workflows démarrent après un changement de statut, donc après la validation, jamais avant l&#x27;extraction.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Un workflow qui écrit un champ relance les scripts de transformation, de validation et d&#x27;enregistrement.</text></g><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">Aussi : champ, tableau,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">enregistrement,</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">approbation (voir ci-dessous)</text></svg>