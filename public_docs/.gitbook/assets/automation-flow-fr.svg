<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Où chaque automatisation s&#x27;exécute dans le flux du document"><title>Où chaque automatisation s&#x27;exécute dans le flux du document</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Flux du document : chaque document passe par ces étapes</text><rect x="20" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="76.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Extraction</text><text x="76.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">champs + tableaux</text><line x1="134" y1="89.0" x2="153" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="156" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="212.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.0" font-weight="700" fill="#0A2531">Transformation</text><text x="212.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">intégré + règles</text><line x1="270" y1="89.0" x2="289" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="292" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="348.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Lookup</text><text x="348.0" y="111" text-anchor="middle" font-family