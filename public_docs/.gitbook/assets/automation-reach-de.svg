" font-weight="400" fill="#0A2531">Ja: Auto-Export braucht Abgleich</text><text x="858" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Nein</text></g><g class="hl" data-k="row3"><rect x="20" y="214" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="214" width="8" height="44" rx="4" fill="#3d4f5c"/><text x="34" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3d4f5c">Skript</text><text x="243" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">13 Auslösepunkte</text><text x="493" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Ja: Felder, Tabellen</text><text x="658" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Indirekt (ungültig, Aufgabe)</text><text x="858" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></g><g class="hl" data-k="row4"><rect x="20" y="264" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="264" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">Standard / Advanced Workflow</text><text x="243" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">nach einer Statusänderung</text><text x="493" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Ja: über Karten</text><text x="658" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, zuweisen, genehmigen</text><text x="858" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Nein</text></g><g class="hl" data-k="row5"><rect x="20" y="314" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="314" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">Workflow-SDK-Karte</text><text x="243" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">wenn der Workflow läuft</text><text x="493" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Ja: Felder, Tabellen</text><text x="658" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, Aufgabe</text><text x="858" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></g></svg>