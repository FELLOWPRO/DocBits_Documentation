" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">工作流 SDK 卡片</text><text x="243" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">工作流运行时</text><text x="493" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">可以：字段、表格</text><text x="658" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">状态、任务</text><text x="858" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></svg>
