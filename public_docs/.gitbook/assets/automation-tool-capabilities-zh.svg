mily="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">否</text><rect x="20" y="114" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"></rect><rect x="20" y="114" width="8" height="44" rx="4" fill="#c98318"></rect><text x="34" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c98318">自定义校验规则</text><text x="243" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">每次校验时</text><text x="493" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">否</text><text x="658" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">取决于规则结果和配置</text><text x="858" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">否</text><rect x="20" y="164" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"></rect><rect x="20" y="164" width="8" height="44" rx="4" fill="#7b5cc4"></rect><text x="34" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7b5cc4">采购订单匹配规则</text><text x="243" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">查找后、按钮触发或新订单号</text><text x="493" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">仅匹配数据</text><text x="658" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">视自动导出条件而定</text><text x="858" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">否</text><rect x="20" y="214" width="920" height="44" rx="8" f