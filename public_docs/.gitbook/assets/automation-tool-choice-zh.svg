<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="如何选择工具" lang="zh"><title>如何选择工具</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"></path></marker></defs><rect width="960" height="590" fill="#ffffff"></rect><rect x="300" y="16" width="360" height="52" rx="12" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"></rect><text x="480" y="48" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">您要完成什么操作？</text><path d="M480 68 L480 92 L129.0 92 L129.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></path><rect x="20.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#1f8ab0" stroke-width="2"></rect><text x="129.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">修改或清理值</text><text x="129.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">删除前缀、格式化日期、</text><text x="129.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">映射代码、设置默认值</text><line x1="129.0" y1="232" x2="129.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></line><rect x="20.0" y="270" width="218.0" height="78" rx="12" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="2"></rect><text x="129.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">转换</text><text x="129.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">规则</text><text x="129.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">需要查找数据、任务或状态操作？</text><text x="129.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">使用脚本。</text><path d="M480 68 L480 92 L363.0 92 L363.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></path><rect x="254.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#c98318" stroke-width="2"></rect><text x="363.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">检查数据并阻止</text><text x="363.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">问题文档</text><text x="363.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">必填、模式、范围、</text><text x="363.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">合计、行项目检查</text><line x1="363.0" y1="232" x2="363.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></line><rect x="254.0" y="270" width="218.0" height="78" rx="12" fill="#fdf1dc" stroke="#c98318" stroke-width="2"></rect><text x="363.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">自定义</text><text x="363.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">校验规则</text><text x="363.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">检查需要主数据或代码？</text><text x="363.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">使用脚本（标记为无效）。</text><path d="M480 68 L480 92 L597.0 92 L597.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></path><rect x="488.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#7b5cc4" stroke-width="2"></rect><text x="597.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">将发票行项目与</text><text x="597.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">订单进行匹配</text><text x="597.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">物料、数量、价格、</text><text x="597.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">容差、备用匹配策略</text><line x1="597.0" y1="232" x2="597.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></line><rect x="488.0" y="270" width="218.0" height="78" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"></rect><text x="597.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">采购订单匹配规则</text><text x="597.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">仅改变匹配结果，</text><text x="597.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">不用于修改抬头字段。</text><path d="M480 68 L480 92 L831.0 92 L831.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></path><rect x="722.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#2f9d6a" stroke-width="2"></rect><text x="831.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">决定下一步操作</text><text x="831.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">分配、审批、创建任务、</text><text x="831.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">发邮件、导出、调用 API</text><line x1="831.0" y1="232" x2="831.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"></line><rect x="722.0" y="270" width="218.0" height="78" rx="12" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="2"></rect><text x="831.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f9d6a">标准工作流</text><text x="831.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">分支、并行路径、错误处理：</text><text x="831.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">使用高级工作流。</text><text x="831.0" y="408" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">缺少卡片：使用工作流 SDK。</text><rect x="20" y="450" width="920" height="112" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"></rect><text x="40" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4f5c">规则或卡片无法表达所需逻辑时使用脚本</text><text x="40" y="506" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• 需要在特定时点执行逻辑（字段变化、校验前、保存时、审批时）</text><text x="40" y="526" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• 需要主数据、任务、状态变化，或跨字段和表格计算</text><text x="40" y="552" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">从适用的简单工具开始：先考虑规则，再考虑脚本，最后考虑工作流或 SDK 卡片。</text></svg>
