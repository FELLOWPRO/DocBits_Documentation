<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Welches KI-Modell gilt für die Vorlage?</title>
<desc id="desc">Organisationsstandard und vorlagenbezogene Überschreibung. Ein Wechsel kann die Extraktion erneut starten. Er ändert nicht automatisch andere Vorlagen oder historische Dokumente.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS  /  PROZESSÜBERSICHT</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Welches KI-Modell gilt für die Vorlage?</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Organisationsstandard und vorlagenbezogene Überschreibung.</text>
<rect x="90" y="277" width="1820" height="110" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="120" y="335.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#126a8a">Zuerst prüfen: Organisation + aktuelle Extraktionsvorlage</text>
<rect x="90" y="460" width="820" height="240" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="509.42" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1c1d1e">Keine Überschreibung für die Vorlage</text>
<text x="114" y="564.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Die anwendbare Organisationseinstellung bestimmt das</text>
<text x="114" y="606.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Modell.</text>
<rect x="1090" y="460" width="820" height="240" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1114" y="509.42" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1c1d1e">Überschreibung für die Vorlage vorhanden</text>
<text x="1114" y="564.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Die gespeicherte Auswahl gilt in diesem Vorlagenkontext.</text>
<polyline points="500,387 500,440" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="500,440 492.80861692093697,426.8362615716444 507.19138307906303,426.8362615716444" fill="#126a8a"/>
<polyline points="1500,387 1500,440" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1500,440 1492.8086169209369,426.8362615716444 1507.1913830790631,426.8362615716444" fill="#126a8a"/>
<text x="90" y="767.96" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#126a8a">Ergebnis mit derselben Dokumentstichprobe vergleichen: Werte · Tabellen · Laufzeit · Kosten</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Ein Wechsel kann die Extraktion erneut starten. Er ändert nicht automatisch andere Vorlagen oder historische Dokumente.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Schematische Erklärung · Ablauf und Optionen richten sich nach Ihrer Konfiguration.</text>
</svg>