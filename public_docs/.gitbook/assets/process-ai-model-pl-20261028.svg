<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Który model AI obowiązuje dla szablonu ekstrakcji?</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Ustawienie domyślne organizacji i ustawienie indywidualne dla szablonu.</text>
