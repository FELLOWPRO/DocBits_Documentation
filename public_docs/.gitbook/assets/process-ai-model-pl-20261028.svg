<text x="1114" y="509.42" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1c1d1e">Ustawienie indywidualne dla szablonu istnieje</text>
<text x="1114" y="564.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Zapisany wybór dotyczy tego kontekstu szablonu.</text>
