<title id="title">Który model AI obowiązuje dla szablonu ekstrakcji?</title>
<desc id="desc">Ustawienie domyślne organizacji i ustawienie indywidualne dla szablonu. Zmiana może ponownie uruchomić wyodrębnianie. Nie zmienia automatycznie innych szablonów ani dokumentów historycznych.</desc>
