<text x="1414" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">According to the effective cleanup</text>
<text x="1414" y="444.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">rules</text>
