<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Document expiration and deletion</title>
<desc id="desc">View two retention settings separately. The graphic does not specify a start date. System standard, cleanup frequency, and deletion scope must be confirmed for your deployment.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS / PROCESS OVERVIEW</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Document expiration and deletion</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">View two retention settings separately.</text>
<rect x="90" y="300" width="570" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Documents in general</text>
<text x="114" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Delete document after</text>
