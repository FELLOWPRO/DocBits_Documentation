<text x="814" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Default or explicit duration</text>
<rect x="1390" y="300" width="520" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
