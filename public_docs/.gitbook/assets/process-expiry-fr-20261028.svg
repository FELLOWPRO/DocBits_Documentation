<rect x="1390" y="520" width="520" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1414" y="567.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Suppression automatique</text>
<text x="1414" y="622.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Selon les règles de nettoyage</text>
<text x="1414" y="664.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">efficaces</text>
