<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Expiration et suppression de documents</title>
<desc id="desc">Affichez deux paramètres de rétention séparément. Le graphique ne précise pas de date de début. La norme du système, la fréquence de nettoyage et la portée de la suppression doivent être confirmées pour votre déploiement.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS / APERÇU DU PROCESSUS</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Expiration et suppression de documents</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Affichez deux paramètres de rétention séparément.</text>
<rect x="90" y="300" width="570" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Documents en général</text>
<text x="114" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Delete document after</text>
<rect x="790" y="300" width="470" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="814" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Valeur sélectionnée</text>
<text x="814" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Default ou durée explicite</text>
<rect x="1390" y="300" width="520" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1414" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Suppression automatique</text>
<text x="1414" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Selon les règles de nettoyage</text>
<text x="1414" y="444.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">efficaces</text>
<polyline points="660,385 770,385" fill="none" stroke="#126a8a" stroke-width="4"/>
