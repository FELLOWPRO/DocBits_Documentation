<title id="title">Verlopen en verwijderen van documenten</title>
<desc id="desc">Bekijk twee bewaarinstellingen afzonderlijk. De grafiek specificeert geen startdatum. Systeemstandaard, opschoonfrequentie en verwijderingsbereik moeten voor uw implementatie worden bevestigd.</desc>
