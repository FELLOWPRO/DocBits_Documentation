<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Expiração e exclusão de documentos</title>
<desc id="desc">Veja duas configurações de retenção separadamente. O gráfico não especifica uma data de início. O padrão do sistema, a frequência de limpeza e o escopo de exclusão devem ser confirmados para sua implantação.</desc>
<rect width="2000" height="1050" fill="white"/>
