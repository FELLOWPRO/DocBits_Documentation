<text x="1414" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">De acordo com as regras de</text>
<text x="1414" y="444.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">limpeza eficazes</text>
