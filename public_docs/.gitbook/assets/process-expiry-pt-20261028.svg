<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Expiração e exclusão de documentos</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Veja duas configurações de retenção separadamente.</text>
<rect x="90" y="300" width="570" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Documentos em geral</text>
<text x="114" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Delete document after</text>
