<text x="1414" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">自动删除</text>
<text x="1414" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">根据有效的清理规则</text>
