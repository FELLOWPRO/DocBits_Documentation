<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Exportar de DocBits</title>
<desc id="desc">Verifique a preparação, a transmissão e o feedback separadamente. Um documento salvo ou aprovação não prova que a exportação foi bem-sucedida. Se houver erros, leia primeiro o feedback.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS / VISÃO GERAL DO PROCESSO</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Exportar de DocBits</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Verifique a preparação, a transmissão e o feedback separadamente.</text>
<rect x="90" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="116" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">01</text>
<text x="116" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Requisitos</text>
<text x="116" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Verifique dados e</text>
<text x="116" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">aprovações necessárias.</text>
<polyline points="510,485 541,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="541,485 527.8362615716444,492.19138307906303 527.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="556" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="582" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">02</text>
<text x="582" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Escolha o destino</text>
<text x="582" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Verifique o destino da</text>
<text x="582" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">exportação quanto ao</text>
<text x="582" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">tipo e organização.</text>
<polyline points="976,485 1007,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1007,485 993.8362615716444,492.19138307906303 993.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1022" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1048" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">03</text>
<text x="1048" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Transferir dados</text>
<text x="1048" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Acione a rota de</text>
<text x="1048" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">exportação pretendida.</text>
<polyline points="1442,485 1473,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1473,485 1459.8362615716444,492.19138307906303 1459.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1488" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1514" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">04</text>
<text x="1514" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Acompanhar resultado</text>
<text x="1514" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Verifique o status, a</text>
<text x="1514" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">resposta e o sistema de</text>
<text x="1514" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">destino.</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Um documento salvo ou aprovação não prova que a exportação foi bem-sucedida. Se houver erros, leia primeiro o feedback.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Explicação esquemática · O processo e as opções dependem da sua configuração.</text>
</svg>