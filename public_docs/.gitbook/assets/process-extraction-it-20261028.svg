<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Dal file ai dati riconosciuti</title>
<desc id="desc">Visualizza separatamente il tipo di documento, l&#x27;origine dati e il percorso di estrazione. Non tutti i documenti passano attraverso OCR. Le origini della tabella e dell&#x27;intestazione possono differire; le impostazioni attive determinano il percorso.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS/PANORAMICA DEL PROCESSO</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Dal file ai dati riconosciuti</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Visualizza separatamente il tipo di documento, l&#x27;origine dati e il percorso di estrazione.</text>
<rect x="90" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="116" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">01</text>
<text x="116" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Preparare l&#x27;input</text>
<text x="116" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Utilizza testo OCR / PDF</text>
<text x="116" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">o dati elettronici</text>
<text x="116" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">strutturati.</text>
<polyline points="510,485 541,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="541,485 527.8362615716444,492.19138307906303 527.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="556" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="582" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">02</text>
<text x="582" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Assegna documento</text>
<text x="582" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Determinare il tipo di</text>
<text x="582" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">documento e, se</text>
<text x="582" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">necessario, il sottotipo.</text>
<polyline points="976,485 1007,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1007,485 993.8362615716444,492.19138307906303 993.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1022" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1048" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">03</text>
<text x="1048" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Estrai dati</text>
<text x="1048" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Estrai campi e tabelle</text>
<text x="1048" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">utilizzando regole o</text>
<text x="1048" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">intelligenza artificiale.</text>
<polyline points="1442,485 1473,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1473,485 1459.8362615716444,492.19138307906303 1459.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1488" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1514" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">04</text>
<text x="1514" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Controlla il risultato</text>
<text x="1514" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Controlla origini, valori ed</text>
<text x="1514" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">righe della fattura.</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Non tutti i documenti passano attraverso OCR. Le origini della tabella e dell&#x27;intestazione possono differire; le impostazioni attive</text>
<text x="118" y="909.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">determinano il percorso.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Spiegazione schematica · Il processo e le opzioni dipendono dalla configurazione.</text>
</svg>