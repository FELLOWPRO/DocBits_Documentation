<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Classifique o status do documento corretamente</title>
<desc id="desc">Processamento, aprovação e exportação são estados diferentes. Percursos esquemáticos, sem uma sequência de estados fixa para todos os documentos. Guardar não equivale a aprovar nem a exportar.</desc>
<rect width="2000" height="1050" fill="white"/>
