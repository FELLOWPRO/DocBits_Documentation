<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1296" viewBox="0 0 1200 1296"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1296" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><text x="64" y="64" fill="#17324d" font-size="46" font-weight="bold">2. Check a field, set a flag and start the export</text><text x="64" y="136" fill="#52687c" font-size="26" font-weight="normal">Real Standard workflow · anonymized configuration</text><rect x="64" y="194" width="1072" height="141" rx="18" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="229" fill="#52687c" font-size="24" font-weight="bold">WHEN · Entry point</text><text x="1060" y="229" fill="#52687c" font-size="23" font-weight="normal">01</text><text x="96" y="274" fill="#17324d" font-size="34" font-weight="bold">Document type is invoice</text><text x="96" y="318" fill="#405c74" font-size="24" font-weight="normal">INVOICE</text><path d="M600 330 V370" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="355" fill="#52687c" font-size="23" font-weight="normal">Yes</text><rect x="64" y="387" width="1072" height="141" rx="18" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="422" fill="#52687c" font-size="24" font-weight="bold">AND · Condition</text><text x="1060" y="422" fill="#52687c" font-size="23" font-weight="normal">02</text><text x="96" y="467" fill="#17324d" font-size="34" font-weight="bold">Status: first approval given, second pending</text><text x="96" y="511" fill="#405c74" font-size="24" font-weight="normal">approved_pending_second_approval</text><path d="M600 523 V563" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="548" fill="#52687c" font-size="23" font-weight="normal">Yes</text><rect x="64" y="580" width="1072" height="141" rx="18" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="615" fill="#52687c" font-size="24" font-weight="bold">AND · Condition</text><text x="1060" y="615" fill="#52687c" font-size="23" font-weight="normal">03</text><text x="96" y="660" fill="#17324d" font-size="34" font-weight="bold">Check field A equals Comparison value A</text><text x="96" y="704" fill="#405c74" font-size="24" font-weight="normal">operator = eq</text><path d="M600 716 V756" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="741" fill="#52687c" font-size="23" font-weight="normal">Yes</text><rect x="64" y="773" width="1072" height="141" rx="18" fill="#e7f5ee" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="808" fill="#52687c" font-size="24" font-weight="bold">THEN · Action</text><text x="1060" y="808" fill="#52687c" font-size="23" font-weight="normal">04</text><text x="96" y="853" fill="#17324d" font-size="34" font-weight="bold">Set Flag B to true</text><text x="96" y="897" fill="#405c74" font-size="24" font-weight="normal">action_set_boolean_field · true</text><path d="M600 909 V949" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="934" fill="#52687c" font-size="23" font-weight="normal">Next</text><rect x="64" y="966" width="1072" height="141" rx="18" fill="#e7f5ee" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="1001" fill="#52687c" font-size="24" font-weight="bold">THEN · Action</text><text x="1060" y="1001" fill="#52687c" font-size="23" font-weight="normal">05</text><text x="96" y="1046" fill="#17324d" font-size="34" font-weight="bold">Call export with validation option false</text><text x="96" y="1090" fill="#405c74" font-size="24" font-weight="normal">export · v3 · boolean = false</text><rect x="64" y="1157" width="1072" height="85" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1199" fill="#6d5324" font-size="29" font-weight="bold">Condition not met? No THEN action in this example.</text></g></svg>