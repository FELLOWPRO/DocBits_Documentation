" font-weight="bold" fill="#17324d">Status ist validiert; Freigabe ausstehend</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">N06–N07: Unterorganisations- und Feldprüfungen → N08: Kontrollkästchenverzweigung →</text><text x="128" y="597" font-size="24" font-weight="normal" fill="#405c74">N10: konfigurierter Export ODER N09: Zuweisung → N16: E-Mail-Anforderung.</text><rect x="100" y="658" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Bedingung</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Status ist bereit zur Prüfung</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N11: Gruppe A zuweisen → N14: E-Mail-Vorlage A an E-Mail-Empfänger A anfordern.</text><rect x="100" y="848" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="882" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Bedingung</text><text x="128" y="927" font-size="34" font-weight="bold" fill="#17324d">Status ist abgelehnt</text><text x="128" y="977" font-size="24" font-weight="normal" fill="#405c74">N13: Gruppe A zuweisen → N15: E-Mail-Vorlage B an E-Mail-Empfänger A anfordern.</text><rect x="100" y="1038" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1072" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Bedingung</text><text x="128" y="1117" font-size="34" font-weight="bold" fill="#17324d">Status ist bereit zur Validierung</text><text x="128" y="1167" font-size="24" font-weight="normal" fill="#405c74">N12: Gruppe A zuweisen. Dieser Pfad ist in der zuletzt gespeicherten Ausführung</text><text x="128" y="1199" font-size="24" font-weight="normal" fill="#405c74">aufgezeichnet.</text><rect x="100" y="1260" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1294" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Bedingung</text><text x="128" y="1339" font-size="34" font-weight="bold" fill="#17324d">Status ist abgeschlossen</text><text x="128" y="1389" font-size="24" font-weight="normal" fill="#405c74">N18: Gruppe A zuweisen.</text><rect x="100" y="1450" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1484" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Bedingung</text><text x="128" y="1529" font-size="34" font-weight="bold" fill="#17324d">Status ist Exportfehler</text><text x="128" y="1579" font-size="24" font-weight="normal" fill="#405c74">N20: Gruppe A zuweisen.</text><rect x="64" y="1640" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1682" font-size="28" font-weight="bold" fill="#6d5324">Gruppierte Konfigurationsübersicht. Separate Zweige werden in eine</text><text x="92" y="1720" font-size="28" font-weight="bold" fill="#6d5324">Warteschlange aufgenommen; sie bilden keine Else-if-Kette. Vollständige</text><text x="92" y="1758" font-size="28" font-weight="bold" fill="#6d5324">Einstellungen und Verbindungen folgen unten.</text></g></svg>