<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1875" viewBox="0 0 1200 1875"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1875" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 447 V523 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V745 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V935 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1125 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1315 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1505 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 423 V447 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A: vista general agrupada de las seis rutas por</text><text x="64" y="121.2" font-size="44" font-weight="bold" fill="#17324d">estado</text><text x="64" y="193" font-size="25" font-weight="normal" fill="#52687c">Configuración Advanced real · diagrama explicativo anonimizado</text><rect x="100" y="271" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="305" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Inicio</text><text x="128" y="350" font-size="34" font-weight="bold" fill="#17324d">El tipo de documento es factura</text><text x="128" y="400" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="493" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="527" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condición</text><text x="128" y="572" font-size="34" font-weight="bold" fill="#17324d">Estado: validado, aprobación pendiente</text><text x="128" y="622" font-size="24" font-weight="normal" fill="#405c74">N06–N07: comprobaciones de suborganización y campo → N08: bifurcación por casilla →</text><text x="128" y="654" font-size="24" font-weight="normal" fill="#405c74">N10: exportación configurada O N09: asignación → N16: solicitud de correo.</text><rect x="100" y="715" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="749" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condición</text><text x="128" y="794" font-size="34" font-weight="bold" fill="#17324d">Estado: listo para revisión</text><text x="128" y="844" font-size="24" font-weight="normal" fill="#405c74">N11: asignar Grupo A → N14: solicitar Plantilla de correo A a Destinatario de correo A.</text><rect x="100" y="905" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="939" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Condición</text><text x="128" y="984" font-size="34" font-weight="bold" fill="#17324d">Estado: rechazado</text><text x="128" y="1034" font-size="24" font-weight="normal" fill="#405c74">N13: asignar Grupo A → N15: solicitar Plantilla de correo B a Destinatario de correo A.</text><rect x="100" y="1095" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1129" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Condición</text><text x="128" y="1174" font-size="34" font-weight="bold" fill="#17324d">Estado: listo para validación</text><text x="128" y="1224" font-size="24" font-weight="normal" fill="#405c74">N12: asignar Grupo A. Esta es la ruta registrada en la última ejecución guardada.</text><rect x="100" y="1285" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1319" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Condición</text><text x="128" y="1364" font-size="34" font-weight="bold" fill="#17324d">Estado: finalizado</text><text x="128" y="1414" font-size="24" font-weight="normal" fill="#405c74">N18: asignar Grupo A.</text><rect x="100" y="1475" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1509" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Condición</text><text x="128" y="1554" font-size="34" font-weight="bold" fill="#17324d">Estado: error de exportación</text><text x="128" y="1604" font-size="24" font-weight="normal" fill="#405c74">N20: asignar Grupo A.</text><rect x="64" y="1665" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1707" font-size="28" font-weight="bold" fill="#6d5324">Mapa agrupado de la configuración. Las ramas independientes entran en</text><text x="92" y="1745" font-size="28" font-weight="bold" fill="#6d5324">una cola; no forman una secuencia else-if. La configuración completa y las</text><text x="92" y="1783" font-size="28" font-weight="bold" fill="#6d5324">conexiones se muestran a continuación.</text></g></svg>