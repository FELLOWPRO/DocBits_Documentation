<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1875" viewBox="0 0 1200 1875"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1875" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 447 V523 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V745 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V935 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1125 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1315 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1505 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 423 V447 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A: panoramica raggruppata dei sei percorsi per</text><text x="64" y="121.2" font-size="44" font-weight="bold" fill="#17324d">stato</text><text x="64" y="193" font-size="25" font-weight="normal" fill="#52687c">Configurazione Advanced reale · diagramma esplicativo anonimizzato</text><rect x="100" y="271" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="305" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Avvio</text><text x="128" y="350" font-size="34" font-weight="bold" fill="#17324d">Il tipo di documento è fattura</text><text x="128" y="400" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="493" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="527" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condizione</text><text x="128" y="572" font-size="34" font-weight="bold" fill="#17324d">Stato: validata, approvazione in attesa</text><text x="128" y="622" font-size="24" font-weight="normal" fill="#405c74">N06–N07: verifiche di sotto-organizzazione e campo → N08: biforcazione tramite casella</text><text x="128" y="654" font-size="24" font-weight="normal" fill="#405c74">→ N10: esportazione configurata O N09: assegnazione → N16: richiesta email.</text><rect x="100" y="715" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="749" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condizione</text><text x="128" y="794" font-size="34" font-weight="bold" fill="#17324d">Stato: pronta per la revisione</text><text x="128" y="844" font-size="24" font-weight="normal" fill="#405c74">N11: assegnare Gruppo A → N14: richiedere Modello email A a Destinatario email A.</text><rect x="100" y="905" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="939" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Condizione</text><text x="128" y="984" font-size="34" font-weight="bold" fill="#17324d">Stato: rifiutata</text><text x="128" y="1034" font-size="24" font-weight="normal" fill="#405c74">N13: assegnare Gruppo A → N15: richiedere Modello email B a Destinatario email A.</text><rect x="100" y="1095" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1129" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Condizione</text><text x="128" y="1174" font-size="34" font-weight="bold" fill="#17324d">Stato: pronta per la validazione</text><text x="128" y="1224" font-size="24" font-weight="normal" fill="#405c74">N12: assegnare Gruppo A. È il percorso registrato nell’ultima esecuzione salvata.</text><rect x="100" y="1285" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1319" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Condizione</text><text x="128" y="1364" font-size="34" font-weight="bold" fill="#17324d">Stato: terminata</text><text x="128" y="1414" font-size="24" font-weight="normal" fill="#405c74">N18: assegnare Gruppo A.</text><rect x="100" y="1475" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1509" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Condizione</text><text x="128" y="1554" font-size="34" font-weight="bold" fill="#17324d">Stato: errore di esportazione</text><text x="128" y="1604" font-size="24" font-weight="normal" fill="#405c74">N20: assegnare Gruppo A.</text><rect x="64" y="1665" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1707" font-size="28" font-weight="bold" fill="#6d5324">Mappa raggruppata della configurazione. I rami separati entrano in una</text><text x="92" y="1745" font-size="28" font-weight="bold" fill="#6d5324">coda; non costituiscono una sequenza else-if. Le impostazioni e le</text><text x="92" y="1783" font-size="28" font-weight="bold" fill="#6d5324">connessioni complete sono riportate di seguito.</text></g></svg>