<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1882" viewBox="0 0 1200 1882"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1882" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 390 V466 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V688 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V910 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1132 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1322 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 390 V1512 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 366 V390 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A: gegroepeerd overzicht van de zes statusroutes</text><text x="64" y="136" font-size="25" font-weight="normal" fill="#52687c">Echte Advanced-configuratie · geanonimiseerd verklarend schema</text><rect x="100" y="214" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="248" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Start</text><text x="128" y="293" font-size="34" font-weight="bold" fill="#17324d">Documenttype is factuur</text><text x="128" y="343" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="436" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="470" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Voorwaarde</text><text x="128" y="515" font-size="34" font-weight="bold" fill="#17324d">Status: gevalideerd; goedkeuring in afwachting</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">N06–N07: suborganisatie- en veldcontroles → N08: selectievakjessplitsing → N10:</text><text x="128" y="597" font-size="24" font-weight="normal" fill="#405c74">geconfigureerde export OF N09: toewijzing → N16: e-mailaanvraag.</text><rect x="100" y="658" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Voorwaarde</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Status is gereed voor beoordeling</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N11: Groep A toewijzen → N14: verzending van E-mailsjabloon A naar E-mailontvanger A</text><text x="128" y="819" font-size="24" font-weight="normal" fill="#405c74">aanvragen.</text><rect x="100" y="880" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="914" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Voorwaarde</text><text x="128" y="959" font-size="34" font-weight="bold" fill="#17324d">Status is afgewezen</text><text x="128" y="1009" font-size="24" font-weight="normal" fill="#405c74">N13: Groep A toewijzen → N15: verzending van E-mailsjabloon B naar E-mailontvanger A</text><text x="128" y="1041" font-size="24" font-weight="normal" fill="#405c74">aanvragen.</text><rect x="100" y="1102" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1136" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Voorwaarde</text><text x="128" y="1181" font-size="34" font-weight="bold" fill="#17324d">Status is gereed voor validatie</text><text x="128" y="1231" font-size="24" font-weight="normal" fill="#405c74">N12: Groep A toewijzen. Deze route is vastgelegd in de laatst opgeslagen uitvoering.</text><rect x="100" y="1292" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1326" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Voorwaarde</text><text x="128" y="1371" font-size="34" font-weight="bold" fill="#17324d">Status is voltooid</text><text x="128" y="1421" font-size="24" font-weight="normal" fill="#405c74">N18: Groep A toewijzen.</text><rect x="100" y="1482" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1516" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Voorwaarde</text><text x="128" y="1561" font-size="34" font-weight="bold" fill="#17324d">Status is exportfout</text><text x="128" y="1611" font-size="24" font-weight="normal" fill="#405c74">N20: Groep A toewijzen.</text><rect x="64" y="1672" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1714" font-size="28" font-weight="bold" fill="#6d5324">Gegroepeerd configuratieoverzicht. Afzonderlijke takken komen in een</text><text x="92" y="1752" font-size="28" font-weight="bold" fill="#6d5324">wachtrij; ze vormen geen else-if-keten. Volledige instellingen en</text><text x="92" y="1790" font-size="28" font-weight="bold" fill="#6d5324">verbindingen volgen hieronder.</text></g></svg>