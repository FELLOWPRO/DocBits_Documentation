<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1939" viewBox="0 0 1200 1939"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1939" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M64 447 V523 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V745 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V967 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1189 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1379 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 447 V1569 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 423 V447 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">A: vista geral agrupada dos seis percursos por</text><text x="64" y="121.2" font-size="44" font-weight="bold" fill="#17324d">estado</text><text x="64" y="193" font-size="25" font-weight="normal" fill="#52687c">Configuração Advanced real · diagrama explicativo anonimizado</text><rect x="100" y="271" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="305" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Acionamento</text><text x="128" y="350" font-size="34" font-weight="bold" fill="#17324d">O tipo de documento é fatura</text><text x="128" y="400" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="493" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="527" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condição</text><text x="128" y="572" font-size="34" font-weight="bold" fill="#17324d">Estado: validado; aprovação pendente</text><text x="128" y="622" font-size="24" font-weight="normal" fill="#405c74">N06–N07: verificações de suborganização e campo → N08: divisão por caixa de seleção</text><text x="128" y="654" font-size="24" font-weight="normal" fill="#405c74">→ N10: exportação configurada OU N09: atribuição → N16: pedido de e-mail.</text><rect x="100" y="715" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="749" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condição</text><text x="128" y="794" font-size="34" font-weight="bold" fill="#17324d">O estado é pronto para revisão</text><text x="128" y="844" font-size="24" font-weight="normal" fill="#405c74">N11: atribuir o Grupo A → N14: solicitar o envio do Modelo de e-mail A ao Destinatário de</text><text x="128" y="876" font-size="24" font-weight="normal" fill="#405c74">e-mail A.</text><rect x="100" y="937" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="971" font-size="23" font-weight="bold" fill="#52687c">N04 · AND · Condição</text><text x="128" y="1016" font-size="34" font-weight="bold" fill="#17324d">O estado é rejeitado</text><text x="128" y="1066" font-size="24" font-weight="normal" fill="#405c74">N13: atribuir o Grupo A → N15: solicitar o envio do Modelo de e-mail B ao Destinatário de</text><text x="128" y="1098" font-size="24" font-weight="normal" fill="#405c74">e-mail A.</text><rect x="100" y="1159" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1193" font-size="23" font-weight="bold" fill="#52687c">N05 · AND · Condição</text><text x="128" y="1238" font-size="34" font-weight="bold" fill="#17324d">O estado é pronto para validação</text><text x="128" y="1288" font-size="24" font-weight="normal" fill="#405c74">N12: atribuir o Grupo A. Este é o percurso registado na última execução guardada.</text><rect x="100" y="1349" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1383" font-size="23" font-weight="bold" fill="#52687c">N17 · AND · Condição</text><text x="128" y="1428" font-size="34" font-weight="bold" fill="#17324d">O estado é concluído</text><text x="128" y="1478" font-size="24" font-weight="normal" fill="#405c74">N18: atribuir o Grupo A.</text><rect x="100" y="1539" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1573" font-size="23" font-weight="bold" fill="#52687c">N19 · AND · Condição</text><text x="128" y="1618" font-size="34" font-weight="bold" fill="#17324d">O estado é erro de exportação</text><text x="128" y="1668" font-size="24" font-weight="normal" fill="#405c74">N20: atribuir o Grupo A.</text><rect x="64" y="1729" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1771" font-size="28" font-weight="bold" fill="#6d5324">Mapa agrupado da configuração. As ramificações separadas entram numa</text><text x="92" y="1809" font-size="28" font-weight="bold" fill="#6d5324">fila; não são uma sequência else-if. As definições e ligações completas</text><text x="92" y="1847" font-size="28" font-weight="bold" fill="#6d5324">encontram-se abaixo.</text></g></svg>