<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1813" viewBox="0 0 1200 1813"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1813" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M618 423 L618 493" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 669 V745 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 669 V999 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 669 V1189 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 669 V1411 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 645 V669 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">B: vista general agrupada de las cuatro rutas por</text><text x="64" y="121.2" font-size="44" font-weight="bold" fill="#17324d">estado</text><text x="64" y="193" font-size="25" font-weight="normal" fill="#52687c">Configuración Advanced real · diagrama explicativo anonimizado</text><rect x="100" y="271" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="305" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Inicio</text><text x="128" y="350" font-size="34" font-weight="bold" fill="#17324d">El tipo de documento es factura</text><text x="128" y="400" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="493" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="527" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Condición</text><text x="128" y="572" font-size="34" font-weight="bold" fill="#17324d">La suborganización es Suborganización A</text><text x="128" y="622" font-size="24" font-weight="normal" fill="#405c74">condition_sub_org_is_isnot · v2 · sub_org_id = Suborganización A · operator = is</text><rect x="100" y="715" width="1036" height="216" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="749" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Condición</text><text x="128" y="794" font-size="34" font-weight="bold" fill="#17324d">Estado: validado, aprobación pendiente</text><text x="128" y="844" font-size="24" font-weight="normal" fill="#405c74">N06/N07: comprobaciones del Campo B → exportación alternativa O comparaciones del</text><text x="128" y="876" font-size="24" font-weight="normal" fill="#405c74">Campo A → asignación por tabla de decisión / alternativa por casillas / exportación. Rama</text><text x="128" y="908" font-size="24" font-weight="normal" fill="#405c74">detallada y tablas completas a continuación.</text><rect x="100" y="969" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1003" font-size="23" font-weight="bold" fill="#52687c">N12 · AND · Condición</text><text x="128" y="1048" font-size="34" font-weight="bold" fill="#17324d">Estado: listo para validación</text><text x="128" y="1098" font-size="24" font-weight="normal" fill="#405c74">N13: asignar Grupo A.</text><rect x="100" y="1159" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1193" font-size="23" font-weight="bold" fill="#52687c">N16 · AND · Condición</text><text x="128" y="1238" font-size="34" font-weight="bold" fill="#17324d">Estado: finalizado</text><text x="128" y="1288" font-size="24" font-weight="normal" fill="#405c74">N19: Campo B=true → N20: Campo C=true → N17: asignar Grupo A. Rama hermana N18:</text><text x="128" y="1320" font-size="24" font-weight="normal" fill="#405c74">Campo C=false → N21: cambio de estado. La última ejecución siguió N17.</text><rect x="100" y="1381" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1415" font-size="23" font-weight="bold" fill="#52687c">N26 · AND · Condición</text><text x="128" y="1460" font-size="34" font-weight="bold" fill="#17324d">Primera aprobación finalizada; segunda pendiente</text><text x="128" y="1510" font-size="24" font-weight="normal" fill="#405c74">N29: Campo C=false → N28: establecer Campo C=true → N27: exportación con</text><text x="128" y="1542" font-size="24" font-weight="normal" fill="#405c74">boolean=false. Primera aprobación finalizada; segunda pendiente.</text><rect x="64" y="1603" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1645" font-size="28" font-weight="bold" fill="#6d5324">Mapa agrupado de la configuración. Las ramas independientes entran en</text><text x="92" y="1683" font-size="28" font-weight="bold" fill="#6d5324">una cola; no forman una secuencia else-if. La configuración completa y las</text><text x="92" y="1721" font-size="28" font-weight="bold" fill="#6d5324">conexiones se muestran a continuación.</text><rect x="581" y="442" width="74" height="29" rx="6" fill="#f8fbfd"/><text x="589" y="464" font-size="22" font-weight="normal" fill="#4f718c">Sí</text></g></svg>