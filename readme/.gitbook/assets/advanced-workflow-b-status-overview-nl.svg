<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1756" viewBox="0 0 1200 1756"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1756" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><path d="M618 366 L618 436" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V688 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V942 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V1132 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M64 612 V1354 H100" fill="none" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 588 V612 H64" fill="none" stroke="#4f718c" stroke-width="3"/><text x="64" y="64" font-size="44" font-weight="bold" fill="#17324d">B: gegroepeerd overzicht van de vier statusroutes</text><text x="64" y="136" font-size="25" font-weight="normal" fill="#52687c">Echte Advanced-configuratie · geanonimiseerd verklarend schema</text><rect x="100" y="214" width="1036" height="152" rx="16" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="248" font-size="23" font-weight="bold" fill="#52687c">N01 · WHEN · Start</text><text x="128" y="293" font-size="34" font-weight="bold" fill="#17324d">Documenttype is factuur</text><text x="128" y="343" font-size="24" font-weight="normal" fill="#405c74">condition_doc_type_is_isnot · v2 · operator = is · doc_type = INVOICE</text><rect x="100" y="436" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="470" font-size="23" font-weight="bold" fill="#52687c">N02 · AND · Voorwaarde</text><text x="128" y="515" font-size="34" font-weight="bold" fill="#17324d">Suborganisatie is Suborganisatie A</text><text x="128" y="565" font-size="24" font-weight="normal" fill="#405c74">condition_sub_org_is_isnot · v2 · sub_org_id = Suborganisatie A · operator = is</text><rect x="100" y="658" width="1036" height="216" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · Voorwaarde</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">Status: gevalideerd; goedkeuring in afwachting</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N06/N07: Veld B-controles → alternatieve export OF Veld A-vergelijkingen →</text><text x="128" y="819" font-size="24" font-weight="normal" fill="#405c74">beslistabeltoewijzing / selectievakjes-terugval / export. Gedetailleerde tak en volledige</text><text x="128" y="851" font-size="24" font-weight="normal" fill="#405c74">tabellen hieronder.</text><rect x="100" y="912" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="946" font-size="23" font-weight="bold" fill="#52687c">N12 · AND · Voorwaarde</text><text x="128" y="991" font-size="34" font-weight="bold" fill="#17324d">Status is gereed voor validatie</text><text x="128" y="1041" font-size="24" font-weight="normal" fill="#405c74">N13: Groep A toewijzen.</text><rect x="100" y="1102" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1136" font-size="23" font-weight="bold" fill="#52687c">N16 · AND · Voorwaarde</text><text x="128" y="1181" font-size="34" font-weight="bold" fill="#17324d">Status is voltooid</text><text x="128" y="1231" font-size="24" font-weight="normal" fill="#405c74">N19: Veld B=true → N20: Veld C=true → N17: Groep A toewijzen. Zustertak N18: Veld</text><text x="128" y="1263" font-size="24" font-weight="normal" fill="#405c74">C=false → N21: statuswijziging. De laatste uitvoering volgde N17.</text><rect x="100" y="1324" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1358" font-size="23" font-weight="bold" fill="#52687c">N26 · AND · Voorwaarde</text><text x="128" y="1403" font-size="34" font-weight="bold" fill="#17324d">Eerste goedkeuring voltooid; tweede in afwachting</text><text x="128" y="1453" font-size="24" font-weight="normal" fill="#405c74">N29: Veld C=false → N28: Veld C=true instellen → N27: export met boolean=false. Eerste</text><text x="128" y="1485" font-size="24" font-weight="normal" fill="#405c74">goedkeuring voltooid; tweede in afwachting.</text><rect x="64" y="1546" width="1072" height="160" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1588" font-size="28" font-weight="bold" fill="#6d5324">Gegroepeerd configuratieoverzicht. Afzonderlijke takken komen in een</text><text x="92" y="1626" font-size="28" font-weight="bold" fill="#6d5324">wachtrij; ze vormen geen else-if-keten. Volledige instellingen en</text><text x="92" y="1664" font-size="28" font-weight="bold" fill="#6d5324">verbindingen volgen hieronder.</text><rect x="581" y="385" width="74" height="29" rx="6" fill="#f8fbfd"/><text x="589" y="407" font-size="22" font-weight="normal" fill="#4f718c">Ja</text></g></svg>