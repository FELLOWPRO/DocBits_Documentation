x="100" y="658" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="692" font-size="23" font-weight="bold" fill="#52687c">N03 · AND · 条件</text><text x="128" y="737" font-size="34" font-weight="bold" fill="#17324d">状态为已验证，等待审批</text><text x="128" y="787" font-size="24" font-weight="normal" fill="#405c74">N06/N07：字段B检查→备用导出，或字段A比较→决策表分配/复选框回退/导出。详细分支</text><text x="128" y="819" font-size="24" font-weight="normal" fill="#405c74">和完整表格见下文。</text><rect x="100" y="880" width="1036" height="152" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="914" font-size="23" font-weight="bold" fill="#52687c">N12 · AND · 条件</text><text x="128" y="959" font-size="34" font-weight="bold" fill="#17324d">状态为准备验证</text><text x="128" y="1009" font-size="24" font-weight="normal" fill="#405c74">N13：分配到组A。</text><rect x="100" y="1070" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1104" font-size="23" font-weight="bold" fill="#52687c">N16 · AND · 条件</text><text x="128" y="1149" font-size="34" font-weight="bold" fill="#17324d">状态为已完成</text><text x="128" y="1199" font-size="24" font-weight="normal" fill="#405c74">N19：字段B=true → N20：字段C=true → N17：分配到组A。同级节点N18：字段C=false</text><text x="128" y="1231" font-size="24" font-weight="normal" fill="#405c74">→ N21：状态变更。最近一次运行经过N17。</text><rect x="100" y="1292" width="1036" height="184" rx="16" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="128" y="1326" font-size="23" font-weight="bold" fill="#52687c">N26 · AND · 条件</text><text x="128" y="1371" font-size="34" font-weight="bold" fill="#17324d">第一次审批完成，等待第二次审批</text><text x="128" y="1421" font-size="24" font-weight="normal" fill="#405c74">N29：字段C=false → N28：设置字段C=true → N27：使用boolean=false导出。第一次审</text><text x="128" y="1453" font-size="24" font-weight="normal" fill="#405c74">批完成，等待第二次审批。</text><rect x="64" y="1514" width="1072" height="122" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1556" font-size="28" font-weight="bold" fill="#6d5324">配置的分组关系图。各独立分支进入队列，并非else-if序列。完整设置和连接见</text><text x="92" y="1594" font-size="28" font-weight="bold" fill="#6d5324">下文。</text><rect x="581" y="385" width="74" height="29" rx="6" fill="#f8fbfd"/><text x="589" y="407" font-size="22" font-weight="normal" fill="#4f718c">是</text></g></svg>