<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="Welches Werkzeug?"><title>Welches Werkzeug?</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="590" fill="#ffffff"/><rect x="300" y="16" width="360" height="52" rx="12" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="480" y="48" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Was möchten Sie tun?</text><path d="M480 68 L480 92 L129.0 92 L129.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Wert ändern oder</text><text x="129.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">bereinigen</text><text x="129.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Präfix entfernen, Datum formatieren,</text><text x="129.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Code abbilden, Standard setzen</text><line x1="129.0" y1="232" x2="129.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="270" width="218.0" height="78" rx="12" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">Transformationsregeln</text><text x="129.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Lookup, Aufgabe oder Status nötig?</text><text x="129.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Dann ein Skript.</text><path d="M480 68 L480 92 L363.0 92 L363.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#c98318" stroke-width="2"/><text x="363.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">Daten prüfen, fehlerhafte</text><text x="363.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">stoppen</text><text x="363.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Pflichtfeld, Muster, Bereich,</text><text x="363.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Summen, Zeilenprüfungen</text><line x1="363.0" y1="232" x2="363.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="270" width="218.0" height="78" rx="12" fill="#fdf1dc" stroke="#c98318" stroke-width="2"/><text x="363.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">Benutzerdef.</text><text x="363.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">Validierungsregeln</text><text x="363.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Prüfung braucht Stammdaten oder Code?</text><text x="363.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Dann ein Skript (als ungültig markieren).</text><path d="M480 68 L480 92 L597.0 92 L597.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">Rechnungspositionen mit</text><text x="597.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">Bestellung abgleichen</text><text x="597.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Artikel, Menge, Preis,</text><text x="597.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">Toleranzen, Fallback</text><line x1="597.0" y1="232" x2="597.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="270" width="218.0" height="78" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">PO-Abgleichsregeln</text><text x="597.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Nur das Abgleichsergebnis. Nicht zum</text><text x="597.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Ändern von Kopffeldern.</text><path d="M480 68 L480 92 L831.0 92 L831.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">Nächsten Schritt</text><text x="831.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">festlegen</text><text x="831.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">zuweisen, genehmigen, Aufgabe erstellen,</text><text x="831.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">E-Mail, Export, API aufrufen</text><line x1="831.0" y1="232" x2="831.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="270" width="218.0" height="78" rx="12" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f9d6a">Standard Workflow</text><text x="831.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Verzweigungen, parallele Pfade, Fehler:</text><text x="831.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Advanced Workflow.</text><text x="831.0" y="408" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Karte fehlt: Workflow SDK.</text><rect x="20" y="450" width="920" height="112" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><text x="40" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4f5c">Skript, wenn keine Regel oder Karte ausreicht</text><text x="40" y="506" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• Sie brauchen Logik zu einem bestimmten Zeitpunkt (bei Feldänderung, vor Validierung, beim Speichern, bei Genehmigung)</text><text x="40" y="526" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• Sie brauchen Stammdaten, eine Aufgabe, eine Statusänderung oder eine Berechnung über Felder und Tabellen</text><text x="40" y="552" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Mit dem einfachsten Werkzeug beginnen: Regeln zuerst, Skript danach, Workflow oder SDK-Karte zuletzt.</text></svg>