<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="Quel outil utiliser"><title>Quel outil utiliser</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="590" fill="#ffffff"/><rect x="300" y="16" width="360" height="52" rx="12" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="480" y="48" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Que voulez-vous faire ?</text><path d="M480 68 L480 92 L129.0 92 L129.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Modifier ou nettoyer une</text><text x="129.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">valeur</text><text x="129.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#5b6f7c">retirer un préfixe, formater une date,</text><text x="129.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.1" font-weight="400" fill="#5b6f7c">mapper un code, définir une valeur par défaut</text><line x1="129.0" y1="232" x2="129.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="270" width="218.0" height="78" rx="12" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">Règles</text><text x="129.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">de transformation</text><text x="129.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Recherche, tâche ou statut ?</text><text x="129.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Utilisez un Script.</text><path d="M480 68 L480 92 L363.0 92 L363.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#c98318" stroke-width="2"/><text x="363.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">Contrôler les données,</text><text x="363.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#c98318">bloquer les documents erronés</text><text x="363.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">obligatoire, motif, plage,</text><text x="363.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">totaux, contrôles de lignes</text><line x1="363.0" y1="232" x2="363.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="270" width="218.0" height="78" rx="12" fill="#fdf1dc" stroke="#c98318" stroke-width="2"/><text x="363.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">Règles</text><text x="363.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">de validation personnalisées</text><text x="363.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#3d4f5c">Contrôle avec données de base ou code ?</text><text x="363.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Script (marquer invalide).</text><path d="M480 68 L480 92 L597.0 92 L597.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">Rapprocher les lignes de</text><text x="597.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">la commande</text><text x="597.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">article, quantité, prix,</text><text x="597.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">tolérances, repli</text><line x1="597.0" y1="232" x2="597.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="270" width="218.0" height="78" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">Règles</text><text x="597.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">de corresp. BC</text><text x="597.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#3d4f5c">Résultat du rapprochement seul. Pas pour</text><text x="597.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">modifier les champs d&#x27;en-tête.</text><path d="M480 68 L480 92 L831.0 92 L831.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">Décider de la suite</text><text x="831.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#5b6f7c">attribuer, approuver, créer une tâche,</text><text x="831.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">e-mail, export, appel d&#x27;API</text><line x1="831.0" y1="232" x2="831.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="270" width="218.0" height="78" rx="12" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f9d6a">Standard Workflow</text><text x="831.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#3d4f5c">Branches, chemins parallèles, erreurs :</text><text x="831.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Advanced Workflow.</text><text x="831.0" y="408" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Carte manquante : Workflow SDK.</text><rect x="20" y="450" width="920" height="112" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><text x="40" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4f5c">Script si aucune règle ni carte ne suffit</text><text x="40" y="506" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• logique à un moment précis (champ modifié, avant validation, enregistrement, approbation)</text><text x="40" y="526" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• données de base, tâche, changement de statut ou calcul sur champs et tableaux</text><text x="40" y="552" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Commencez simple : règles d&#x27;abord, Script ensuite, Workflow ou carte SDK en dernier.</text></svg>