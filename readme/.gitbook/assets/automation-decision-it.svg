<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="Quale strumento usare"><title>Quale strumento usare</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="590" fill="#ffffff"/><rect x="300" y="16" width="360" height="52" rx="12" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="480" y="48" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Cosa vuoi fare?</text><path d="M480 68 L480 92 L129.0 92 L129.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Modificare o pulire un</text><text x="129.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">valore</text><text x="129.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.7" font-weight="400" fill="#5b6f7c">togliere un prefisso, formattare una data,</text><text x="129.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5b6f7c">mappare un codice, impostare un default</text><line x1="129.0" y1="232" x2="129.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="20.0" y="270" width="218.0" height="78" rx="12" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="2"/><text x="129.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">Regole</text><text x="129.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f8ab0">di Trasformazione</text><text x="129.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.0" font-weight="400" fill="#3d4f5c">Serve una ricerca, un&#x27;attività o uno stato?</text><text x="129.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Usa uno Script.</text><path d="M480 68 L480 92 L363.0 92 L363.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#c98318" stroke-width="2"/><text x="363.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">Controllare i dati e</text><text x="363.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#c98318">fermare i documenti errati</text><text x="363.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">obbligatorio, pattern, intervallo,</text><text x="363.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">totali, controlli sulle righe</text><line x1="363.0" y1="232" x2="363.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="254.0" y="270" width="218.0" height="78" rx="12" fill="#fdf1dc" stroke="#c98318" stroke-width="2"/><text x="363.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">Regole</text><text x="363.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c98318">di convalida personalizzate</text><text x="363.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.1" font-weight="400" fill="#3d4f5c">Il controllo richiede dati anagrafici o codice?</text><text x="363.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Usa uno Script (non valido).</text><path d="M480 68 L480 92 L597.0 92 L597.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">Abbinare le righe della</text><text x="597.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7b5cc4">fattura all&#x27;ordine</text><text x="597.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">articolo, quantità, prezzo,</text><text x="597.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">tolleranze, alternativa</text><line x1="597.0" y1="232" x2="597.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="488.0" y="270" width="218.0" height="78" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"/><text x="597.0" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">Regole</text><text x="597.0" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7b5cc4">Corrispondenza PO</text><text x="597.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#3d4f5c">Solo esito dell&#x27;abbinamento. Non per</text><text x="597.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">modificare i campi di intestazione.</text><path d="M480 68 L480 92 L831.0 92 L831.0 118" fill="none" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="120" width="218.0" height="112" rx="12" fill="#ffffff" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">Decidere cosa succede</text><text x="831.0" y="163" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f9d6a">dopo</text><text x="831.0" y="196" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#5b6f7c">assegnare, approvare, creare attività,</text><text x="831.0" y="212" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">e-mail, esportare, chiamare un&#x27;API</text><line x1="831.0" y1="232" x2="831.0" y2="268" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="722.0" y="270" width="218.0" height="78" rx="12" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="2"/><text x="831.0" y="302" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f9d6a">Standard Workflow</text><text x="831.0" y="376" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Rami, percorsi paralleli, errori:</text><text x="831.0" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Advanced Workflow.</text><text x="831.0" y="408" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#3d4f5c">Scheda mancante: Workflow SDK.</text><rect x="20" y="450" width="920" height="112" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><text x="40" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4f5c">Usa uno Script quando né regole né schede bastano</text><text x="40" y="506" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• serve logica in un momento preciso (modifica campo, prima della convalida, al salvataggio, all&#x27;approvazione)</text><text x="40" y="526" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">• servono dati anagrafici, un&#x27;attività, un cambio di stato o un calcolo tra campi e tabelle</text><text x="40" y="552" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Parti dallo strumento più semplice: prima le regole, poi uno Script, per ultimo Workflow o scheda SDK.</text></svg>