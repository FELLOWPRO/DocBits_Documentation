" stroke-width="1.6"/><text x="892.0" y="77" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Ready for</text><text x="892.0" y="93" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">validation</text><text x="892.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">evento de estado</text><g class="hl" data-k="tr"><line x1="212.0" y1="122" x2="212.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" /><rect x="150" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6"/><text x="212.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Reglas de</text><text x="212.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">transformación</text><text x="212.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">sin código</text><text x="212.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">se ejecutan aquí</text></g><g class="hl" data-k="tr"><line x1="348.0" y1="122" x2="348.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="286" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="348.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Reglas marcadas</text><text x="348.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.9" font-weight="700" fill="#1f8ab0">&quot;tras la búsqueda&quot;</text><text x="348.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">opcional</text><text x="348.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">pasada extra</text></g><g class="hl" data-k="po"><line x1="484.0" y1="122" x2="484.0" y2="160" stroke="#7b5cc4" stroke-width="1.6" /><rect x="422" y="160" width="124" height="84" rx="10" fill="#efeafb" stroke="#7b5cc4" stroke-width="1.6"/><text x="484.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">Reglas de</text><text x="484.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">coincidencia OC</text><text x="484.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">también: botón</text><text x="484.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.9" font-weight="400" fill="#3d4f5c">Auto PO Match, nueva OC</text></g><g class="hl" data-k="tr"><line x1="620.0" y1="122" x2="620.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="558" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="620.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Reglas de</text><text x="620.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">transformación</text><text x="620.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">todas, otra vez</text><text x="620.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">tras PO match</text></g><g class="hl" data-k="cv"><line x1="756.0" y1="122" x2="756.0" y2="160" stroke="#c98318" stroke-width="1.6" /><rect x="694" y="160" width="124" height="84" rx="10" fill="#fdf1dc" stroke="#c98318" stroke-width="1.6"/><text x="756.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#c98318">Custom Validation</text><text x="756.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c98318">Rules</text><text x="756.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">cada validación</text><text x="756.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">y cada guardado</text></g><g class="hl" data-k="wf"><line x1="892.0" y1="122" x2="892.0" y2="160" stroke="#2f9d6a" stroke-width="1.6" /><rect x="830" y="160" width="124" height="84" rx="10" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="1.6"/><text x="892.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f9d6a">Workflows</text><text x="892.0" y="201" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">Standard · Advanced</text><text x="892.0" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">· tarjetas SDK</text><text x="892.0" y="229" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.1" font-weight="400" fill="#3d4f5c">se inician tras el estado</text></g><g class="hl" data-k="script"><rect x="20" y="300" width="920" height="64" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><line x1="144.0" y1="122" x2="144.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="144.0" cy="316" r="11" fill="#3d4f5c"/><text x="144.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">A</text><text x="144.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Tras extracción</text><text x="144.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Antes de transformación</text><line x1="280.0" y1="122" x2="280.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="280.0" cy="316" r="11" fill="#3d4f5c"/><text x="280.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">B</text><text x="280.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Tras</text><text x="280.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">transformación</text><line x1="416.0" y1="122" x2="416.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="416.0" cy="316" r="11" fill="#3d4f5c"/><text x="416.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">C</text><text x="416.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Antes del</text><text x="416.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">PO matching</text><line x1="688.0" y1="122" x2="688.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="688.0" cy="316" r="11" fill="#3d4f5c"/><text x="688.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">D</text><text x="688.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Antes de</text><text x="688.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validación</text><line x1="824.0" y1="122" x2="824.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="824.0" cy="316" r="11" fill="#3d4f5c"/><text x="824.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">E</text><text x="824.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Tras</text><text x="824.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validación</text><rect x="14" y="268" width="660" height="26" fill="#ffffff"/><text x="20" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d4f5c">Script: se ejecuta en los puntos de activación que elija (13 en total, se muestran los principales)</text><text x="20" y="396" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Mientras un usuario trabaja en el documento en la pantalla de validación</text><rect x="20.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="129.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="700" fill="#1f8ab0">Editar un campo o celda de tabla</text><text x="129.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script de cambio de campo / tabla</text><text x="129.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Vista previa de transformación</text><rect x="254.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="363.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Guardar o Validar</text><text x="363.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Transformación → Validación</text><text x="363.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script de guardado → re-match OC</text><rect x="488.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="597.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Aprobar o rechazar</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script de aprobación</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">luego cambia el estado</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.9" font-weight="700" fill="#1f8ab0">Cualquier cambio de estado</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Se inician los Workflows</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">(también web hooks)</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Los bloques y líneas discontinuos son opcionales. Los Workflows se inician tras un cambio de estado, es decir, tras la validación, nunca antes de la extracción.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Un workflow que escribe un campo vuelve a activar los scripts de transformación, validación y guardado.</text></g><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">También al cambiar campo,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">tabla, al guardar y</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">aprobar (ver abajo)</text></svg>