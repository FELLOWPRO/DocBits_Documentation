<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Where each automation runs in the document flow"><title>Where each automation runs in the document flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">Document flow: every document goes through these steps</text><rect x="20" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="76.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Extraction</text><text x="76.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">fields + tables</text><line x1="134" y1="89.0" x2="153" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="156" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="212.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Transform</text><text x="212.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">built-in + rules</text><line x1="270" y1="89.0" x2="289" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="292" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="348.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Lookup</text><text x="348.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">master data</text><line x1="406" y1="89.0" x2="425" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="428" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="484.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">PO matching</text><text x="484.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">lines ↔ order</text><line x1="542" y1="89.0" x2="561" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="564" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="620.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Reformat</text><text x="620.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">second pass</text><line x1="678" y1="89.0" x2="697" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="700" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="756.0" y="81" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Validation</text><text x="756.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">checks</text><line x1="814" y1="89.0" x2="833" y2="89.0" stroke="#b8c7d1" stroke-width="2" marker-end="url(#ah)"/><rect x="836" y="56" width="112" height="66" rx="10" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1.6"/><text x="892.0" y="77" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">Ready for</text><text x="892.0" y="93" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A2531">validation</text><text x="892.0" y="111" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6f7c">status event</text><line x1="212.0" y1="122" x2="212.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" /><rect x="150" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6"/><text x="212.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Transformation</text><text x="212.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Rules</text><text x="212.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">no code</text><text x="212.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">runs here</text><line x1="348.0" y1="122" x2="348.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="286" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="348.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Rules marked</text><text x="348.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">&quot;after lookup&quot;</text><text x="348.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">optional</text><text x="348.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">extra pass</text><line x1="484.0" y1="122" x2="484.0" y2="160" stroke="#7b5cc4" stroke-width="1.6" /><rect x="422" y="160" width="124" height="84" rx="10" fill="#efeafb" stroke="#7b5cc4" stroke-width="1.6"/><text x="484.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">PO Matching</text><text x="484.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7b5cc4">Rules</text><text x="484.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">also: Auto PO Match</text><text x="484.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">button, new PO no.</text><line x1="620.0" y1="122" x2="620.0" y2="160" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="558" y="160" width="124" height="84" rx="10" fill="#e3f3f9" stroke="#1f8ab0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="620.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Transformation</text><text x="620.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f8ab0">Rules again</text><text x="620.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">all rules, again</text><text x="620.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">after PO match</text><line x1="756.0" y1="122" x2="756.0" y2="160" stroke="#c98318" stroke-width="1.6" /><rect x="694" y="160" width="124" height="84" rx="10" fill="#fdf1dc" stroke="#c98318" stroke-width="1.6"/><text x="756.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c98318">Custom Validation</text><text x="756.0" y="197" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c98318">Rules</text><text x="756.0" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">every validation</text><text x="756.0" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">run, every save</text><line x1="892.0" y1="122" x2="892.0" y2="160" stroke="#2f9d6a" stroke-width="1.6" /><rect x="830" y="160" width="124" height="84" rx="10" fill="#e1f5ec" stroke="#2f9d6a" stroke-width="1.6"/><text x="892.0" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f9d6a">Workflows</text><text x="892.0" y="201" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">Standard · Advanced</text><text x="892.0" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">· SDK cards</text><text x="892.0" y="229" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3d4f5c">start after the status</text><rect x="20" y="300" width="920" height="64" rx="12" fill="#e8edf0" stroke="#3d4f5c" stroke-width="1.6"/><line x1="144.0" y1="122" x2="144.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="144.0" cy="316" r="11" fill="#3d4f5c"/><text x="144.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">A</text><text x="144.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">After extraction</text><text x="144.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Before transformation</text><line x1="280.0" y1="122" x2="280.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="280.0" cy="316" r="11" fill="#3d4f5c"/><text x="280.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">B</text><text x="280.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">After</text><text x="280.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">transformation</text><line x1="416.0" y1="122" x2="416.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="416.0" cy="316" r="11" fill="#3d4f5c"/><text x="416.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">C</text><text x="416.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Before</text><text x="416.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">PO matching</text><line x1="688.0" y1="122" x2="688.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="688.0" cy="316" r="11" fill="#3d4f5c"/><text x="688.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">D</text><text x="688.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">Before</text><text x="688.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validation</text><line x1="824.0" y1="122" x2="824.0" y2="300" stroke="#3d4f5c" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="824.0" cy="316" r="11" fill="#3d4f5c"/><text x="824.0" y="321" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">E</text><text x="824.0" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">After</text><text x="824.0" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#3d4f5c">validation</text><rect x="14" y="268" width="660" height="26" fill="#ffffff"/><text x="20" y="286" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3d4f5c">Script: runs at the trigger points you choose (13 in total, main ones shown)</text><text x="20" y="396" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f8ab0">While a user works on the document in the validation screen</text><rect x="20.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="129.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Edit a field or table cell</text><text x="129.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script on field / table change</text><text x="129.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Transformation Rules preview</text><rect x="254.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="363.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Save or Validate</text><text x="363.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Transformation Rules → Validation</text><text x="363.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script on save → PO re-match</text><rect x="488.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="597.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Approve or reject</text><text x="597.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Script on approval</text><text x="597.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">then the status changes</text><rect x="722.0" y="410" width="218.0" height="92" rx="10" fill="#ffffff" stroke="#1f8ab0" stroke-width="1.6"/><text x="831.0" y="436" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8ab0">Any status change</text><text x="831.0" y="460" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">Workflows start</text><text x="831.0" y="476" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#0A2531">(also web hooks)</text><text x="20" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">Dashed chips and lines are optional. Workflows start after a status change, so after validation, never before extraction.</text><text x="20" y="570" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5b6f7c">A workflow that writes a field triggers the transformation, validation and save scripts again.</text><text x="552" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">Also on field change,</text><text x="552" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">table change, save,</text><text x="552" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#3d4f5c">approval (see below)</text></svg>