<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="O que cada ferramenta pode fazer"><title>O que cada ferramenta pode fazer</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6f7c"/></marker></defs><rect width="960" height="380" fill="#ffffff"/><rect x="20" y="16" width="920" height="40" rx="8" fill="#1f8ab0" stroke="#1f8ab0" stroke-width="1.6"/><text x="28" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ferramenta</text><text x="243" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Executa quando</text><text x="493" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pode alterar dados</text><text x="658" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.1" font-weight="700" fill="#ffffff">Pode barrar um documento</text><text x="858" y="42" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Código</text><g class="hl" data-k="row0"><rect x="20" y="64" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="64" width="8" height="44" rx="4" fill="#1f8ab0"/><text x="34" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#1f8ab0">Regras de Transformação</text><text x="243" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">cada passagem e salvamento</text><text x="493" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Sim: campos, tabelas</text><text x="658" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text><text x="858" y="91" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text></g><g class="hl" data-k="row1"><rect x="20" y="114" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="114" width="8" height="44" rx="4" fill="#c98318"/><text x="34" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.45" font-weight="700" fill="#c98318">Regras de Validação Personalizadas</text><text x="243" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">cada execução de validação</text><text x="493" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text><text x="658" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Sim: erro ou aviso</text><text x="858" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text></g><g class="hl" data-k="row2"><rect x="20" y="164" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="164" width="8" height="44" rx="4" fill="#7b5cc4"/><text x="34" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.45" font-weight="700" fill="#7b5cc4">Regras de Correspondência de PO</text><text x="243" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">após consulta, botão, novo PO</text><text x="493" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.7" font-weight="400" fill="#0A2531">Só dados de correspondência</text><text x="658" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.4" font-weight="400" fill="#0A2531">Sim: exportação exige correspondência</text><text x="858" y="191" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text></g><g class="hl" data-k="row3"><rect x="20" y="214" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="214" width="8" height="44" rx="4" fill="#3d4f5c"/><text x="34" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3d4f5c">Script</text><text x="243" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">13 pontos de acionamento</text><text x="493" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Sim: campos, tabelas</text><text x="658" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.9" font-weight="400" fill="#0A2531">Indiretamente (inválido, tarefa)</text><text x="858" y="241" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></g><g class="hl" data-k="row4"><rect x="20" y="264" width="920" height="44" rx="8" fill="#eef3f6" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="264" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.45" font-weight="700" fill="#2f9d6a">Standard / Advanced Workflow</text><text x="243" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">após uma mudança de status</text><text x="493" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Sim: via cards</text><text x="658" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, atribuir, aprovar</text><text x="858" y="291" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Não</text></g><g class="hl" data-k="row5"><rect x="20" y="314" width="920" height="44" rx="8" fill="#ffffff" stroke="#b8c7d1" stroke-width="1"/><rect x="20" y="314" width="8" height="44" rx="4" fill="#2f9d6a"/><text x="34" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f9d6a">Card Workflow SDK</text><text x="243" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">quando o workflow é executado</text><text x="493" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Sim: campos, tabelas</text><text x="658" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Status, tarefa</text><text x="858" y="341" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0A2531">Python</text></g></svg>