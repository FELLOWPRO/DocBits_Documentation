<title id="title">当前提取模板使用哪个 AI 模型？</title>
<desc id="desc">组织默认设置与提取模板专用设置。 更改可以重新启动提取。它不会自动更改其他模板或历史文档。</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOBCITS / 流程概述</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">当前提取模板使用哪个 AI 模型？</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">组织默认设置与提取模板专用设置。</text>
<rect x="90" y="277" width="1820" height="110" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="120" y="327.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#126a8a">首先检查：组织+当前提取模板</text>
<rect x="90" y="460" width="820" height="240" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="509.42" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1c1d1e">未设置模板专用模型</text>
<text x="114" y="564.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">适用的组织设置决定了模型。</text>
<rect x="1090" y="460" width="820" height="240" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1114" y="509.42" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1c1d1e">已设置模板专用模型</text>
<text x="1114" y="564.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">保存的选择适用于该模板上下文。</text>
<polyline points="500,387 500,440" fill="none" stroke="#126a8a" stroke-width="4"/>
