<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Aprobar o rechazar factura</title>
<desc id="desc">Distinguir entre examen, decisión y posterior entrega. Una aprobación inicial puede requerir más revisores. Un registro de aprobación no prueba una exportación ERP.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS / DESCRIPCIÓN GENERAL DEL PROCESO</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Aprobar o rechazar factura</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Distinguir entre examen, decisión y posterior entrega.</text>
<rect x="90" y="380" width="440" height="190" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="114" y="427.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Revisar documento</text>
<text x="114" y="477.68" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#6a6f72">Compare los datos con el original</text>
<text x="114" y="511.68" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#6a6f72">según los requisitos de su empresa.</text>
<rect x="650" y="380" width="410" height="190" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="674" y="427.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">decisión</text>
<text x="674" y="482.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Un revisor autorizado</text>
<text x="674" y="524.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">decide.</text>
<polyline points="530,475 630,475" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="630,475 616.8362615716444,482.19138307906303 616.8362615716444,467.80861692093697" fill="#126a8a"/>
<rect x="1260" y="280" width="650" height="175" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1284" y="327.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Aprobar</text>
<text x="1284" y="382.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">¿Otra etapa? El próximo revisor autorizado.</text>
<rect x="1260" y="520" width="650" height="175" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1284" y="567.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Rechazar</text>
<text x="1284" y="622.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Aclare y vuelva a enviar según su proceso.</text>
<polyline points="1060,475 1150,475 1150,367 1240,367" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1240,367 1226.8362615716444,374.19138307906303 1226.8362615716444,359.80861692093697" fill="#126a8a"/>
<polyline points="1150,475 1150,607 1240,607" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1240,607 1226.8362615716444,614.191383079063 1226.8362615716444,599.808616920937" fill="#126a8a"/>
<text x="1260" y="734.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">Consulta el historial tras la decisión.</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Una aprobación inicial puede requerir más revisores. Un registro de aprobación no prueba una exportación ERP.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Explicación esquemática · El proceso y las opciones dependen de su configuración.</text>
</svg>