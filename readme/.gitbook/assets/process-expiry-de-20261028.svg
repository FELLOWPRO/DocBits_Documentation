<text x="814" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Gewählter Wert</text>
<text x="814" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Default oder explizite Dauer</text>
<rect x="1390" y="300" width="520" height="180" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1414" y="347.78" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1c1d1e">Automatische Löschung</text>
<text x="1414" y="402.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Nach den wirksamen</text>
<text x="1414" y="444.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#6a6f72">Bereinigungsregeln</text>
