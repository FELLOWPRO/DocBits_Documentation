<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Die Grafik legt keinen Fristbeginn fest. Systemstandard, Bereinigungsrhythmus und Löschumfang müssen für Ihre Bereitstellung bestätigt</text>
<text x="118" y="909.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">werden.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Schematische Erklärung · Ablauf und Optionen richten sich nach Ihrer Konfiguration.</text>
