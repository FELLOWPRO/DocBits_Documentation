<text x="1514" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">vergleichen.</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Kein Dokument sichtbar? Zuerst Importkanal und Protokoll prüfen. Bei Verarbeitungsfehlern den Dokumentstatus öffnen.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Schematische Erklärung · Ablauf und Optionen richten sich nach Ihrer Konfiguration.</text>
