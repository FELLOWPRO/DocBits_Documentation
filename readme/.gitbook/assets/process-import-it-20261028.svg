<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Importa documenti</title>
<desc id="desc">Dalla ricezione all&#x27;elaborazione fino alla revisione. Nessun documento visibile? Controlla prima il canale di importazione e i log. Per errori di elaborazione aprire lo stato del documento.</desc>
<rect width="2000" height="1050" fill="white"/>
<text x="90" y="69.68" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#126a8a">DOCBITS/PANORAMICA DEL PROCESSO</text>
<text x="90" y="149.46" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1c1d1e">Importa documenti</text>
<text x="90" y="208.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#6a6f72">Dalla ricezione all&#x27;elaborazione fino alla revisione.</text>
<rect x="90" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="116" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">01</text>
<text x="116" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Seleziona canale</text>
<text x="116" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Carica, invia tramite</text>
<text x="116" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">e-mail, FTP o API /</text>
<text x="116" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Webhook.</text>
<polyline points="510,485 541,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="541,485 527.8362615716444,492.19138307906303 527.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="556" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="582" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">02</text>
<text x="582" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Controllare l&#x27;input</text>
<text x="582" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Controllare la ricezione e</text>
<text x="582" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">la corretta</text>
<text x="582" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">organizzazione.</text>
<polyline points="976,485 1007,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1007,485 993.8362615716444,492.19138307906303 993.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1022" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1048" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">03</text>
<text x="1048" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Elaborare il documento</text>
<text x="1048" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Riconoscere tipo, campi</text>
<text x="1048" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">di intestazione e tabelle.</text>
<polyline points="1442,485 1473,485" fill="none" stroke="#126a8a" stroke-width="4"/>
<polygon points="1473,485 1459.8362615716444,492.19138307906303 1459.8362615716444,477.80861692093697" fill="#126a8a"/>
<rect x="1488" y="315" width="420" height="340" rx="14" fill="white" stroke="#d5dadc" stroke-width="2"/>
<text x="1514" y="366.32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#126a8a">04</text>
<text x="1514" y="424.06" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1c1d1e">Controlla il risultato</text>
<text x="1514" y="490.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">Aprire per la convalida e</text>
<text x="1514" y="534.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">confrontare con</text>
<text x="1514" y="578.24" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#6a6f72">l&#x27;originale.</text>
<rect x="90" y="815" width="1820" height="150" rx="14" fill="#e9f4fa" stroke="none" stroke-width="2"/>
<text x="118" y="868.78" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#126a8a">Nessun documento visibile? Controlla prima il canale di importazione e i log. Per errori di elaborazione aprire lo stato del documento.</text>
<text x="90" y="1019.04" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6a6f72">Spiegazione schematica · Il processo e le opzioni dipendono dalla configurazione.</text>
</svg>