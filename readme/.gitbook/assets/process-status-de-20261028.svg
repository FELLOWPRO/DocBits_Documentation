<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-labelledby="title desc">
<title id="title">Dokumentstatus richtig einordnen</title>
<desc id="desc">Verarbeitung, Genehmigung und Export sind unterschiedliche Zustände. Schematische Spuren, keine feste Statusfolge für jedes Dokument. Speichern ist weder Genehmigung noch Export.</desc>
