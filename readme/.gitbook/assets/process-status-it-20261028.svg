<title id="title">Classificare correttamente lo stato del documento</title>
<desc id="desc">Elaborazione, approvazione ed esportazione sono stati diversi. Percorsi schematici, non una sequenza di stati fissa per ogni documento. Salvare non equivale ad approvare o esportare.</desc>
