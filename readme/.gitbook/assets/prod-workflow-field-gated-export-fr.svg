<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4f718c"/></marker></defs><rect width="1200" height="1440" fill="#f8fbfd"/><g font-family="Arial, PingFang SC, sans-serif"><text x="64" y="64" fill="#17324d" font-size="46" font-weight="bold">2. Vérifier un champ, activer un indicateur et</text><text x="64" y="123.80000000000001" fill="#17324d" font-size="46" font-weight="bold">lancer l’export</text><text x="64" y="196" fill="#52687c" font-size="26" font-weight="normal">Workflow standard réel · configuration anonymisée</text><rect x="64" y="254" width="1072" height="141" rx="18" fill="#e9f1ff" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="289" fill="#52687c" font-size="24" font-weight="bold">WHEN · Déclenchement</text><text x="1060" y="289" fill="#52687c" font-size="23" font-weight="normal">01</text><text x="96" y="334" fill="#17324d" font-size="34" font-weight="bold">Le type de document est Facture</text><text x="96" y="378" fill="#405c74" font-size="24" font-weight="normal">INVOICE</text><path d="M600 390 V430" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="415" fill="#52687c" font-size="23" font-weight="normal">Oui</text><rect x="64" y="447" width="1072" height="141" rx="18" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="482" fill="#52687c" font-size="24" font-weight="bold">AND · Condition</text><text x="1060" y="482" fill="#52687c" font-size="23" font-weight="normal">02</text><text x="96" y="527" fill="#17324d" font-size="34" font-weight="bold">Statut : première approbation obtenue, seconde en attente</text><text x="96" y="571" fill="#405c74" font-size="24" font-weight="normal">approved_pending_second_approval</text><path d="M600 583 V623" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="608" fill="#52687c" font-size="23" font-weight="normal">Oui</text><rect x="64" y="640" width="1072" height="185" rx="18" fill="#eef4f8" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="675" fill="#52687c" font-size="24" font-weight="bold">AND · Condition</text><text x="1060" y="675" fill="#52687c" font-size="23" font-weight="normal">03</text><text x="96" y="720" fill="#17324d" font-size="34" font-weight="bold">Le champ de contrôle A correspond à la valeur de</text><text x="96" y="764" fill="#17324d" font-size="34" font-weight="bold">comparaison A</text><text x="96" y="808" fill="#405c74" font-size="24" font-weight="normal">operator = eq</text><path d="M600 820 V860" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="845" fill="#52687c" font-size="23" font-weight="normal">Oui</text><rect x="64" y="877" width="1072" height="141" rx="18" fill="#e7f5ee" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="912" fill="#52687c" font-size="24" font-weight="bold">THEN · Action</text><text x="1060" y="912" fill="#52687c" font-size="23" font-weight="normal">04</text><text x="96" y="957" fill="#17324d" font-size="34" font-weight="bold">Définir l’indicateur B sur vrai</text><text x="96" y="1001" fill="#405c74" font-size="24" font-weight="normal">action_set_boolean_field · true</text><path d="M600 1013 V1053" stroke="#4f718c" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="1038" fill="#52687c" font-size="23" font-weight="normal">Ensuite</text><rect x="64" y="1070" width="1072" height="141" rx="18" fill="#e7f5ee" stroke="#c4d4e0" stroke-width="2"/><text x="96" y="1105" fill="#52687c" font-size="24" font-weight="bold">THEN · Action</text><text x="1060" y="1105" fill="#52687c" font-size="23" font-weight="normal">05</text><text x="96" y="1150" fill="#17324d" font-size="34" font-weight="bold">Appeler l’export avec l’option de validation false</text><text x="96" y="1194" fill="#405c74" font-size="24" font-weight="normal">export · v3 · boolean = false</text><rect x="64" y="1261" width="1072" height="125" rx="14" fill="#fff3de" stroke="#dfd0ae" stroke-width="2"/><text x="92" y="1303" fill="#6d5324" font-size="29" font-weight="bold">Une condition n’est pas remplie ? Aucune action THEN dans cet</text><text x="92" y="1343" fill="#6d5324" font-size="29" font-weight="bold">exemple.</text></g></svg>