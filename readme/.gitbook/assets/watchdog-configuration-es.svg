  <rect y="40" width="800" height="16" fill="url(#headerGrad)"></rect>
  <text x="400" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">WatchDog — Configuración en 4 pestañas</text>

  <!-- Tab bar background -->
  <rect x="32" y="72" width="736" height="38" rx="10" fill="#f0f3ff"></rect>

  <!-- Tab 1: General (active) -->
  <rect x="36" y="74" width="172" height="34" rx="8" fill="#005cad"></rect>
  <text x="122" y="96" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">General</text>

  <!-- Tab 2: Logs -->
  <rect x="216" y="74" width="172" height="34" rx="8" fill="none"></rect>
  <text x="302" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">Registros</text>

  <!-- Tab 3: XSLT Templates -->
