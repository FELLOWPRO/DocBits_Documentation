<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06" flood-color="#001b3c"></feDropShadow>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005cad"></stop>
      <stop offset="100%" stop-color="#0075d8"></stop>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="#f9f9ff"></rect>

  <!-- Header -->
  <rect width="800" height="56" rx="16" fill="url(#headerGrad)"></rect>
  <rect y="40" width="800" height="16" fill="url(#headerGrad)"></rect>
  <text x="400" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">WatchDog 配置 — 4 个选项卡</text>

  <!-- Tab bar background -->
  <rect x="32" y="72" width="736" height="38" rx="10" fill="#f0f3ff"></rect>

  <!-- Tab 1: General (active) -->
  <rect x="36" y="74" width="172" height="34" rx="8" fill="#005cad"></rect>
  <text x="122" y="96" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">常规</text>

  <!-- Tab 2: Logs -->
  <rect x="216" y="74" width="172" height="34" rx="8" fill="none"></rect>
  <text x="302" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">日志</text>

  <!-- Tab 3: XSLT Templates -->
  <rect x="396" y="74" width="172" height="34" rx="8" fill="none"></rect>
  <text x="482" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">XSLT 模板</text>

  <!-- Tab 4: Export Configs -->
  <rect x="576" y="74" width="188" height="34" rx="8" fill="none"></rect>
  <text x="670" y="96" text-anchor="middle" fill="#44474e" font-size="12" font-weight="600">导出配置</text>

  <!-- Tab 1 Content: General -->
  <rect x="32" y="118" width="172" height="200" rx="14" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="32" y="118" width="172" height="200" rx="14" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <rect x="32" y="118" width="172" height="36" rx="14" fill="#005cad" opacity="0.06"></rect>
  <rect x="32" y="140" width="172" height="14" fill="#005cad" opacity="0.06"></rect>
  <text x="118" y="142" text-anchor="middle" fill="#005cad" font-size="12" font-weight="700">常规</text>

  <!-- General items -->
  <g transform="translate(48, 166)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">文件夹设置</text>
  </g>
  <text x="70" y="188" fill="#44474e" font-size="10">监控 / 成功 / 导出</text>

  <g transform="translate(48, 200)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">文档类型</text>
  </g>
  <text x="70" y="222" fill="#44474e" font-size="10">PDF、发票、采购订单等</text>

  <g transform="translate(48, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">导出目标</text>
  </g>
  <text x="70" y="256" fill="#44474e" font-size="10">选择目标系统</text>

  <!-- Tab 2 Content: Logs -->
  <rect x="216" y="118" width="172" height="200" rx="14" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="216" y="118" width="172" height="200" rx="14" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <rect x="216" y="118" width="172" height="36" rx="14" fill="#005cad" opacity="0.06"></rect>
  <rect x="216" y="140" width="172" height="14" fill="#005cad" opacity="0.06"></rect>
  <text x="302" y="142" text-anchor="middle" fill="#005cad" font-size="12" font-weight="700">日志</text>

  <g transform="translate(232, 166)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">事件监控</text>
  </g>
  <text x="254" y="188" fill="#44474e" font-size="10">实时日志流</text>

  <g transform="translate(232, 200)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">按类型或日期筛选</text>
  </g>
  <text x="254" y="222" fill="#44474e" font-size="10">快速缩小结果范围</text>

  <g transform="translate(232, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">OpenSearch</text>
  </g>
  <text x="254" y="256" fill="#44474e" font-size="10">日志全文搜索</text>

  <!-- Tab 3 Content: XSLT Templates -->
  <rect x="396" y="118" width="172" height="200" rx="14" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="396" y="118" width="172" height="200" rx="14" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <rect x="396" y="118" width="172" height="36" rx="14" fill="#005cad" opacity="0.06"></rect>
  <rect x="396" y="140" width="172" height="14" fill="#005cad" opacity="0.06"></rect>
  <text x="482" y="142" text-anchor="middle" fill="#005cad" font-size="12" font-weight="700">XSLT 模板</text>

  <g transform="translate(412, 166)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">上传模板</text>
  </g>
  <text x="434" y="188" fill="#44474e" font-size="10">上传并编辑 XSLT</text>

  <g transform="translate(412, 200)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">实时校验</text>
  </g>
  <text x="434" y="222" fill="#44474e" font-size="10">部署前测试</text>

  <g transform="translate(412, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">关联配置</text>
  </g>
  <text x="434" y="256" fill="#44474e" font-size="10">关联到导出配置</text>

  <!-- Tab 4 Content: Export Configs -->
  <rect x="576" y="118" width="192" height="200" rx="14" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="576" y="118" width="192" height="200" rx="14" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <rect x="576" y="118" width="192" height="36" rx="14" fill="#005cad" opacity="0.06"></rect>
  <rect x="576" y="140" width="192" height="14" fill="#005cad" opacity="0.06"></rect>
  <text x="672" y="142" text-anchor="middle" fill="#005cad" font-size="12" font-weight="700">导出配置</text>

  <g transform="translate(592, 166)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">配置列表</text>
  </g>
  <text x="614" y="188" fill="#44474e" font-size="10">管理所有导出配置</text>

  <g transform="translate(592, 200)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">连接状态</text>
  </g>
  <text x="614" y="222" fill="#44474e" font-size="10">实时运行状态</text>

  <g transform="translate(592, 234)">
    <circle cx="6" cy="6" r="4" fill="#005cad" opacity="0.2"></circle>
    <circle cx="6" cy="6" r="2" fill="#005cad"></circle>
    <text x="16" y="10" fill="#1a1c1e" font-size="11" font-weight="500">下载配置</text>
  </g>
  <text x="614" y="256" fill="#44474e" font-size="10">为 WatchDog 导出 JSON</text>

  <!-- Important callout -->
  <rect x="32" y="330" width="736" height="44" rx="12" fill="#d97706" opacity="0.06"></rect>
  <rect x="32" y="330" width="736" height="44" rx="12" fill="none" stroke="#d97706" stroke-opacity="0.15"></rect>
  <g transform="translate(50, 344)">
    <circle cx="10" cy="10" r="10" fill="#d97706" opacity="0.15"></circle>
    <text x="10" y="15" text-anchor="middle" fill="#d97706" font-size="13" font-weight="700">!</text>
  </g>
  <text x="80" y="358" fill="#d97706" font-size="12" font-weight="700">注意</text>
  <text x="116" y="358" fill="#1a1c1e" font-size="12" font-weight="500">所有导出配置必须指定 doc_type</text>

  <!-- Bottom export methods bar -->
  <rect x="32" y="388" width="736" height="48" rx="12" fill="#ffffff" filter="url(#shadow)"></rect>
  <rect x="32" y="388" width="736" height="48" rx="12" fill="none" stroke="#c0c6d5" stroke-opacity="0.15"></rect>
  <text x="52" y="410" fill="#44474e" font-size="10" font-weight="600" letter-spacing="0.8">6 种导出方式</text>

  <!-- Method badges -->
  <rect x="52" y="416" width="60" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="82" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">文件夹</text>

  <rect x="122" y="416" width="80" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="162" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">Infor IDM</text>

  <rect x="212" y="416" width="84" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="254" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">Infor BOD</text>

  <rect x="306" y="416" width="72" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="342" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">ION API</text>

  <rect x="388" y="416" width="82" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="429" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">GLS840MI</text>

  <rect x="480" y="416" width="72" height="18" rx="9" fill="#005cad" opacity="0.08"></rect>
  <text x="516" y="429" text-anchor="middle" fill="#005cad" font-size="9.5" font-weight="600">REST API</text>
</svg>
